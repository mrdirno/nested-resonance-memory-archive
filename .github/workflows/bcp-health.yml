name: BCP library health
on:
  push:
    branches: [main]
    paths: ['bcp_lib/**', '.github/workflows/bcp-health.yml', '.github/workflows/publish-bcp.yml']
  pull_request:
    paths: ['bcp_lib/**', '.github/workflows/bcp-health.yml', '.github/workflows/publish-bcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install library and optional features
        run: python -m pip install './bcp_lib[dev,monitor,viz]'
      - name: Exercise real monitoring and plotting behavior
        working-directory: bcp_lib
        run: python -m pytest tests --cov=bcp --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90.01
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcp-coverage-python-${{ matrix.python }}
          path: bcp_lib/coverage.xml
          retention-days: 14
