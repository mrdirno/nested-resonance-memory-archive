name: HALO instrument health
# Main pushes enter through deploy_bridge's reusable job. Avoid running the same
# nine suites twice on separate runners for every deployment.
on:
  pull_request:
    paths: ['HELIOS-BRIDGE-ARCHIVE/HELIOS-V501-halo-resonance-chamber.html', 'tests/halo/**', 'experiments/halo/*.py', '.github/workflows/halo-health.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/halo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser driver
        working-directory: tests/halo
        run: npm ci
      - name: Install Chromium
        working-directory: tests/halo
        run: npx playwright install --with-deps chromium
      - name: Install independent numerical references
        run: python -m pip install -r tests/halo/requirements-physics.txt
      - name: Exercise the actual GPU page
        working-directory: tests/halo
        run: npm test && npm run test:physics
      - name: Keep receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo-instrument-receipts
          path: |
            tests/halo/workspace/release/
            tests/halo/shots/
          retention-days: 14
