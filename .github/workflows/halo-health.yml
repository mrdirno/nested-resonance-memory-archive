name: HALO instrument health
# Filter instrument changes independently of the shared Pages deployment.
# A toolkit-only update must not wait behind GPU/numerical checks.
on:
  push:
    branches: [main]
    paths: ['HELIOS-BRIDGE-ARCHIVE/HELIOS-V501-halo-resonance-chamber.html', 'tests/halo/**', 'experiments/halo/*.py', '.github/workflows/halo-health.yml']
  pull_request:
    paths: ['HELIOS-BRIDGE-ARCHIVE/HELIOS-V501-halo-resonance-chamber.html', 'tests/halo/**', 'experiments/halo/*.py', '.github/workflows/halo-health.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Independent workers keep a UI failure from hiding numerical results.
    # Each worker still runs its suites sequentially against one sealed page.
    strategy:
      fail-fast: false
      matrix:
        suite: [release, physics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/halo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser driver
        working-directory: tests/halo
        run: npm ci
      - name: Install Chromium
        working-directory: tests/halo
        run: npx playwright install --with-deps chromium
      - name: Install independent numerical references
        run: python -m pip install -r tests/halo/requirements-physics.txt
      - name: Exercise the GPU page and controls
        if: matrix.suite == 'release'
        working-directory: tests/halo
        run: npm test
      - name: Check numerical behavior and independent references
        if: matrix.suite == 'physics'
        working-directory: tests/halo
        run: npm run test:physics
      - name: Keep receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo-instrument-receipts-${{ matrix.suite }}
          path: |
            tests/halo/workspace/release/
            tests/halo/shots/
          retention-days: 14
