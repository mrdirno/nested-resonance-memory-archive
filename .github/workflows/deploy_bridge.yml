name: Deploy Bridge UI to GitHub Pages

# Publishes ONE Pages artifact containing two apps:
#   HELIOS-BRIDGE/dist        -> /nested-resonance-memory-archive/
#   tools/collage-studio/dist -> /nested-resonance-memory-archive/collage/
# The repo-root collage/ and collage-beta/ directories are NOT served and never
# were -- only the artifact uploaded below reaches Pages.

on:
  push:
    branches: [ main ]
    paths:
      - 'HELIOS-BRIDGE/**'
      - 'tools/collage-studio/**'
      - 'collage-beta/**'
      - 'HELIOS-BRIDGE-ARCHIVE/**'
      # field toolkits: the shared runtime + one entry per trade (see TRADES below)
      - 'shared/**'
      - 'av/**'
      - 'plumbing/**'
      - 'electrical/**'
      - 'hvac/**'
      - 'low-voltage/**'
      - 'gc/**'
      - 'framing/**'
      - 'roofing/**'
      - 'creative/**'
      - 'concrete/**'
      - 'masonry/**'
      - 'sitework/**'
      - 'flooring/**'
      - 'painting/**'
      - 'doors/**'
      - 'landscape/**'
      # the commons — the human layer, shared by every trade and owned by none
      - 'commons/**'
      # The network manifest is staged from the repo root below, so it needs its
      # own trigger: without this line, raising the declared level is a correct
      # edit on disk that never reaches the web, and the file says L1 in the repo
      # while the published copy still says L0. Editing the manifest IS a deploy.
      - 'wish-it-better.json'
      - '.github/workflows/deploy_bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # BOTH lockfiles. A cache key derived from one lockfile while two
          # projects are installed silently serves a stale/partial store.
          cache-dependency-path: |
            HELIOS-BRIDGE/package-lock.json
            tools/collage-studio/package-lock.json

      - name: Install dependencies (bridge)
        run: npm ci
        working-directory: HELIOS-BRIDGE

      - name: Build (bridge)
        run: |
          npm run build
          touch dist/.nojekyll
        working-directory: HELIOS-BRIDGE

      - name: Install dependencies (collage studio)
        run: npm ci
        working-directory: tools/collage-studio

      # `vite build` is esbuild: it STRIPS types without checking them, so a real
      # type error ships silently. One of the ten this gate was added to catch
      # was a live freeze (a project load left previewSrc undefined and the
      # stencil layout awaited an onload that never came). Runs BEFORE the build
      # so a broken type never reaches the artifact.
      - name: Typecheck (collage studio)
        run: npm run typecheck
        working-directory: tools/collage-studio

      - name: Build (collage studio)
        run: npm run build
        working-directory: tools/collage-studio

      # ORDER IS LOAD-BEARING: `vite build` empties its outDir, so this copy has
      # to run AFTER the bridge build. Staged before it, the collage tree is
      # silently deleted and the deploy goes green with a 404 at /collage/.
      - name: Stage sibling pages into Pages tree
        run: |
          set -euo pipefail

          # The artifact IS the published site: anything not copied in here is a
          # 404, no matter that it exists at repo root. Every path staged below
          # must have a matching entry in the TOOLS registry in
          # HELIOS-BRIDGE/components/UIComponents.tsx, and vice versa.

          # built app
          rm -rf HELIOS-BRIDGE/dist/collage
          mkdir -p HELIOS-BRIDGE/dist/collage
          cp -R tools/collage-studio/dist/. HELIOS-BRIDGE/dist/collage/

          # static pages — no build step, straight copy
          rm -rf HELIOS-BRIDGE/dist/collage-beta HELIOS-BRIDGE/dist/archive HELIOS-BRIDGE/dist/shared
          mkdir -p HELIOS-BRIDGE/dist/collage-beta HELIOS-BRIDGE/dist/archive HELIOS-BRIDGE/dist/shared
          cp -R collage-beta/. HELIOS-BRIDGE/dist/collage-beta/
          cp -R HELIOS-BRIDGE-ARCHIVE/. HELIOS-BRIDGE/dist/archive/

          # FIELD TOOLKITS — one runtime (shared/toolkit.js), many trades. Every
          # trade dir is a config (trade.js) + a registry (tools.js) + tool pages,
          # so ADDING A TRADE IS ADDING ITS SLUG HERE and to the `paths:` trigger
          # at the top of this file. Nothing else. `test -d` keeps it fail-closed:
          # a slug with no dir fails the build instead of silently 404ing the site.
          cp -R shared/. HELIOS-BRIDGE/dist/shared/
          TRADES="av plumbing electrical hvac low-voltage gc framing roofing creative concrete masonry sitework flooring painting doors landscape"
          # Each `run:` block is its OWN shell, so a later step cannot see this
          # variable — publish it to the job env so the assert step below checks
          # exactly the list that was staged, from ONE definition.
          echo "TRADES=$TRADES" >> "$GITHUB_ENV"
          for t in $TRADES; do
            test -d "$t" || { echo "MISSING trade dir: $t"; exit 1; }
            rm -rf "HELIOS-BRIDGE/dist/$t"
            mkdir -p "HELIOS-BRIDGE/dist/$t"
            cp -R "$t/." "HELIOS-BRIDGE/dist/$t/"
            # Working notes (*.md) are not pages: they stay in the repository and
            # are not served (av/AV_SOCIETY.md had been live verbatim, ~660 KB).
            find "HELIOS-BRIDGE/dist/$t" -name '*.md' -delete
            echo "staged trade: $t"
          done

          # THE COMMONS — the human layer, and deliberately NOT a trade: it has no
          # trade.js (a config here would make every disk-derived trade count report
          # a seventh trade that does not exist), so it cannot ride the loop above.
          # shared/toolkit.js links it from the nav dropdown of EVERY page of EVERY
          # trade with no per-trade guard, which is exactly the shape that put a 404
          # behind /plumbing/credits.html for that toolkit's entire life — so it is
          # staged here and asserted below rather than assumed.
          test -d commons || { echo "MISSING: commons/"; exit 1; }
          rm -rf HELIOS-BRIDGE/dist/commons
          mkdir -p HELIOS-BRIDGE/dist/commons
          cp -R commons/. HELIOS-BRIDGE/dist/commons/
          echo "staged commons"

          # THE NETWORK MANIFESTS — the files on this site that a machine is
          # entitled to guess. wish-it-better.json had been at the repo root and
          # committed since a8487909, and it 404'd at
          # https://mrdirno.github.io/nested-resonance-memory-archive/wish-it-better.json
          # for its whole life, because THE ARTIFACT IS THE SITE and the repo root
          # is not inside it. Two projects on the Wish It Better network — the AV
          # Field Toolkit and Collage Studio — are addressed by the /av/ and
          # /collage/ URLs above, and a card or a crawler handed one of those gets
          # the URL and nothing else: no repo, no clone, no way to reach a file
          # that exists only in a git tree. A chip carries ONE url with no way to
          # walk up from it, so the manifest has to sit beside the page it opens.
          #
          # SCOPE, decided 2026-08-19: ONE MANIFEST PER SURFACE THE NETWORK LISTS,
          # plus the repo's own at the root. From 2026-08-13 to that date the ONE
          # repo-root file was copied to /, /av/ and /collage/ and asserted
          # byte-identical — the right shape for level and licence, which are
          # properties of the repo, and the wrong one for ORIGIN (criterion 5 of
          # the network): the toolkit and Collage Studio have different lineages,
          # and a file copied to two urls can carry only one. The network sweep in
          # mrdirno/vibe-cards (tools/verify_pages_artifact.mjs --network-registry)
          # said exactly that: "shares one published manifest ... byte-identical
          # copies of a single file, which can carry only ONE origin ... Criterion 5
          # is unclosable for at least one of them until ... their repo publishes a
          # per-surface manifest". So:
          #   /wish-it-better.json         <- wish-it-better.json   (repo root: the repo's own)
          #   /av/wish-it-better.json      <- av/wish-it-better.json (tracked; rides the trade copy above)
          #   /collage/wish-it-better.json <- tools/collage-studio/public/wish-it-better.json (tracked; vite copies public/ into dist/)
          # Each is TRACKED at its own source, so it has git history and an owner —
          # the credits.json lesson, kept. NO FALLBACK COPY: a surface whose
          # manifest is missing fails the build here rather than silently publishing
          # the repo-scoped file under a project's url, which is the same drift this
          # step used to forbid in the other direction. The `origin` in each
          # per-surface file is kept byte-identical by hand to that project's entry
          # in mrdirno/vibe-cards src/site/network.json, because the sweep compares
          # the two; the root's origin is the repo's and is compared with nothing.
          test -f wish-it-better.json || { echo "MISSING: wish-it-better.json at the repo root"; exit 1; }
          cp wish-it-better.json HELIOS-BRIDGE/dist/wish-it-better.json
          echo "staged network manifest: / (repo root)"
          for dest in av/ collage/; do
            f="HELIOS-BRIDGE/dist/${dest}wish-it-better.json"
            test -f "$f" || { echo "FAIL: $f is not in the artifact — /$dest is a URL the network lists, and its manifest is tracked at its own source (av/wish-it-better.json, tools/collage-studio/public/wish-it-better.json); nothing is copied there from the root any more, by design"; exit 1; }
            if cmp -s wish-it-better.json "$f"; then
              echo "FAIL: $f is byte-identical to the repo-root manifest — a per-surface manifest declares its own surface (project, origin, wish_channel); the copy door is shut on purpose"; exit 1
            fi
            echo "staged network manifest: /$dest (per-surface, tracked at its source)"
          done

      # The wishing well POSTs to Supabase with the PUBLIC anon key. It is
      # public-by-design, but a JWT-shaped string cannot live in this public repo
      # (secret-scan guard), so it is injected HERE from repo secrets into the
      # deployed copy only. Fail-closed: a missing secret or an un-replaced
      # placeholder aborts the deploy rather than shipping a dead well.
      # ONE runtime serves every trade, so this injects exactly once — a new trade
      # inherits a live well with no change to this step.
      - name: Inject wishing-well config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "FAIL: SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are not set"; exit 1; fi

          # GLOB, don't name. This used to inject into shared/toolkit.js by name,
          # which silently shipped a DEAD well the moment a second shared module
          # needed the same config — shared/feedback.js (the universal wishing well
          # that Collage Studio and every non-trade surface carries) would have gone
          # live with literal __SUPABASE_URL__ placeholders and refused every
          # submission. Every current and future shared module gets the config.
          test -d HELIOS-BRIDGE/dist/shared || { echo "MISSING: dist/shared"; exit 1; }
          injected=0
          for f in HELIOS-BRIDGE/dist/shared/*.js; do
            grep -q '__SUPABASE_' "$f" || continue
            sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g; s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" "$f"
            echo "  injected: $(basename "$f")"
            injected=$((injected + 1))
          done

          # Fail closed both ways: nothing injected means the placeholders were
          # renamed and every well on the site is dead; a surviving placeholder
          # means one file was missed.
          [ "$injected" -gt 0 ] || { echo "FAIL: no shared module carried a __SUPABASE_ placeholder — the wells would all be dead"; exit 1; }
          if grep -rq '__SUPABASE_' HELIOS-BRIDGE/dist/shared/; then
            echo "FAIL: a __SUPABASE_ placeholder survived injection:"
            grep -rl '__SUPABASE_' HELIOS-BRIDGE/dist/shared/; exit 1; fi
          echo "wishing-well config injected into $injected shared module(s)"

      # Prove the artifact tree instead of asserting it, and fail here rather
      # than in a browser if either app's entry point is missing.
      - name: Show artifact tree
        run: |
          set -euo pipefail
          # NOTE: never `... | sort | head -N` under `set -o pipefail`. head closes
          # the pipe, sort dies on SIGPIPE, and pipefail turns a successful listing
          # into a failed build. Materialise first, then slice.
          tree_file="$(mktemp)"
          find HELIOS-BRIDGE/dist -maxdepth 2 | sort > "$tree_file"
          echo "--- artifact tree (top 2 levels; $(find HELIOS-BRIDGE/dist -type f | wc -l) files total) ---"
          head -40 "$tree_file"

          echo "--- every published entry point present ---"
          for f in index.html .nojekyll \
                   collage/index.html collage/sw.js collage/manifest.json collage/credits.json \
                   collage-beta/index.html \
                   archive/index.html archive/HELIOS-V501-halo-resonance-chamber.html archive/HELIOS-V501-halo-og.jpg og-bridge.jpg \
                   shared/toolkit.js shared/feedback.js shared/find.js \
                   commons/index.html commons/gear.js commons/commons.js commons/commons.css \
                   commons/tips.html commons/tips.js \
                   commons/names.html commons/names.js \
                   av/index.html av/trade.js av/tools.js av/consumables.html av/credits.html av/report-builder.html; do
            test -f "HELIOS-BRIDGE/dist/$f" || { echo "MISSING: $f"; exit 1; }
          done

          # THE COMMONS IS LINKED FROM EVERY TRADE'S NAV, so prove it works rather
          # than prove it exists. Its data file is the whole page — an index.html
          # that loads a missing gear.js returns 200 and renders an empty list, the
          # exact "looks alive in a curl, blank in a foreman's hand" failure the
          # per-trade dependency assert below was written for.
          grep -q 'commons/' HELIOS-BRIDGE/dist/shared/toolkit.js \
            || { echo "FAIL: shared/toolkit.js no longer links the Commons — the nav entry and the staged dir must move together"; exit 1; }
          grep -q 'COMMONS_GEAR' HELIOS-BRIDGE/dist/commons/gear.js \
            || { echo "FAIL: commons/gear.js does not define COMMONS_GEAR"; exit 1; }
          grep -q 'COMMONS_TIPS' HELIOS-BRIDGE/dist/commons/tips.js \
            || { echo "FAIL: commons/tips.js does not define COMMONS_TIPS"; exit 1; }
          grep -q 'COMMONS_NAMES' HELIOS-BRIDGE/dist/commons/names.js \
            || { echo "FAIL: commons/names.js does not define COMMONS_NAMES"; exit 1; }
          for dep in commons.css commons.js gear.js tips.js names.js ../shared/feedback.js ../shared/find.js; do
            ( cd HELIOS-BRIDGE/dist/commons && test -f "$dep" ) \
              || { echo "FAIL: a commons surface loads $dep, which is not in the artifact"; exit 1; }
          done
          n_gear=$(grep -c 'id:' HELIOS-BRIDGE/dist/commons/gear.js || true)
          [ "$n_gear" -ge 20 ] || { echo "FAIL: commons/gear.js carries only $n_gear items — an empty commons is not a commons"; exit 1; }
          n_tips=$(grep -c 'id:' HELIOS-BRIDGE/dist/commons/tips.js || true)
          [ "$n_tips" -ge 20 ] || { echo "FAIL: commons/tips.js carries only $n_tips tips — an empty commons is not a commons"; exit 1; }

          # THE FEEDBACK AREAS ARE DERIVED, AND A HAND-WRITTEN COPY IS A BUILD
          # FAILURE. Both surfaces used to spell the trade list out in their own
          # <script> block. Trade #10 shipped a toolkit, was added to
          # COMMONS_TRADES so it got its chip here, and was in NEITHER copy — and
          # feedback.js REQUIRES an area for a bug or an improvement, so a
          # concrete finisher could tick concrete rows and then had two ways to
          # report one wrong: file it against another man's trade, or give up.
          # The list exists once; a second copy of it is the scar.
          for f in HELIOS-BRIDGE/dist/commons/*.html; do
            grep -q 'areas: *Commons.areas()' "$f" \
              || { echo "FAIL: $(basename "$f") does not take its feedback areas from Commons.areas() — a hand-written trade list here rots the day a trade ships"; exit 1; }
          done

          # EVERY CHIP IS BACKED BY ROWS SOMEBODY WROTE FOR THAT TRADE — and the
          # two asserts above are exactly why this one had to be written.
          #
          # Roofing shipped as trade #8 with a chip here and NOTHING behind it.
          # The file-wide floors were green (102 and 114), and the browser gate
          # asked only for "more than zero rows of its own" — which was also
          # green, because an unrelated commit had widened three universal rows
          # to the eight construction trades and swept roofing in by accident.
          # For four days a roofer tapped his chip and was told his trade's gear
          # is a cordless drill, a torpedo level and a non-contact voltage tester.
          # A guard written to the letter of the last scar, satisfied by an
          # accident. A total is not coverage, and "> 0" is not a bar.
          #
          # A row WRITTEN FOR a trade is tagged NARROWLY; a row a trade was swept
          # into carries the whole board. So the measure is specificity, not
          # count, and the trade list is parsed from the shipped engine so a trade
          # added next month is covered the day it lands with no edit here.
          node -e '
            const fs = require("fs");
            const D = "HELIOS-BRIDGE/dist/commons/";
            const load = (f, k) => { const w = {}; (new Function("window", fs.readFileSync(D + f, "utf8")))(w); return w[k]; };
            const trades = load("commons.js", "COMMONS_TRADES").map(t => t.slug).filter(s => s !== "universal");
            /* The surface list is parsed out of the shipped engine too, so a
               commons surface added next month is coverage-gated the day it
               lands with no edit to this file. It used to be a pair list typed
               here, which is the same rot one floor up. */
            const surfaces = load("commons.js", "COMMONS_SURFACES").filter(s => s.data && s.rows);
            const FLOOR = 6;              /* every honest trade carries 7-22; roofing carried 0 */
            const NARROW = 3;             /* tagged to at most three trades = written for one of them */
            let bad = 0;
            for (const { data: file, rows: key, noun } of surfaces) {
              const rows = load(file, key);
              for (const t of trades) {
                const own = rows.filter(r => r.t.includes(t) && !r.t.includes("universal"));
                const written = own.filter(r => r.t.length <= NARROW);
                if (written.length < FLOOR) {
                  console.error(`FAIL: ${t} has a chip on the commons and only ${written.length} ${noun} row(s) written for it (${own.length} carry the tag). A chip with nothing behind it is a lie told to one trade.`);
                  bad++;
                }
              }
            }
            process.exit(bad ? 1 : 0);
          ' || exit 1

          # THE NAME TABLE HAS TO ROUTE, OR IT IS A GLOSSARY.
          #
          # The panel that ranked this rung voted it down once on exactly one
          # argument: this project has met the translation problem twice and
          # solved it both times as ROUTING INSIDE A TOOL, and a synonym that only
          # sits in a list does no work. The answer shipped is that names.js is an
          # INDEX every commons surface searches through — type "marrette" into the
          # gear list and wire connectors comes up, though that word appears
          # nowhere in gear.js.
          #
          # That claim is one rename away from silently becoming false: the join
          # is by the object's plain name, so re-wording a gear row unhooks it and
          # nothing on screen changes. So the join is COUNTED here, against the
          # artifact, through the engine's own exported fold rather than a second
          # copy of the rule.
          node -e '
            const fs = require("fs");
            const D = "HELIOS-BRIDGE/dist/commons/";
            const w = {};
            for (const f of ["commons.js", "names.js", "gear.js", "tips.js"]) {
              (new Function("window", fs.readFileSync(D + f, "utf8")))(w);
            }
            if (!w.Commons || typeof w.Commons.aka !== "function") {
              console.error("FAIL: commons.js no longer exports the alias join (Commons.aka)"); process.exit(1);
            }
            const FLOOR = 12;
            const joined = w.COMMONS_GEAR.filter(r => w.Commons.aka(r).length > 0);
            if (joined.length < FLOOR) {
              console.error(`FAIL: only ${joined.length} of ${w.COMMONS_GEAR.length} gear rows are reachable by a name from names.js (floor ${FLOOR}). The name table has come unhooked from the gear list and is a glossary again.`);
              process.exit(1);
            }
            console.log(`commons join: ${joined.length}/${w.COMMONS_GEAR.length} gear rows findable by a word that is not on the gear list`);
          ' || exit 1

          # ...AND THE GATE ABOVE COUNTS THE DATA, NOT THE ARTIFACT (§SCARS 2026-08-16).
          #
          # It loads all four files into ONE synthetic window, so names.js is always
          # present by construction and it can never see a real PAGE that omits the
          # script tag. tips.html omitted it for two days and every check above was
          # green: the file was in the artifact, the join counted, the surface list
          # resolved. The claim "every commons surface searches through the index"
          # was false on a third of them and nothing could tell.
          #
          # The omission was deliberate and well-reasoned when it was made — the
          # index JOINS on an object's generic name, a tip is a sentence, and 0 of
          # 147 tips carry one, so the join is worth nothing there and still is. It
          # went wrong when the HAND-OFF landed in the shared engine, because the
          # hand-off needs NO join: it routes a man who typed a word this surface
          # cannot answer to the table that owns it. The zero join is exactly what
          # makes tips the surface most likely to be asked one, and it was the only
          # one with no way out — 404 words the commons knows, 11 dead-ending and
          # 13 answered CONFIDENTLY WRONG ("Teflon tape" matched a tip about tape).
          #
          # So assert the tag on the real page, with comments stripped: the reason
          # this hid in review is that tips.html *mentioned* names.js, in a comment
          # explaining why it was absent. A grep would have passed.
          node -e '
            const fs = require("fs");
            const D = "HELIOS-BRIDGE/dist/commons/";
            const w = {};
            (new Function("window", fs.readFileSync(D + "commons.js", "utf8")))(w);
            let bad = 0;
            for (const s of (w.COMMONS_SURFACES || [])) {
              const html = fs.readFileSync(D + s.href, "utf8").replace(/<!--[\s\S]*?-->/g, "");
              const srcs = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m => m[1]);
              for (const dep of ["names.js", s.data]) {
                if (!srcs.includes(dep)) {
                  console.error(`FAIL: ${s.href} does not load ${dep}. Every commons surface searches THROUGH the alias index — a surface without it answers a word the commons knows with a dead end or a confident wrong row.`);
                  bad++;
                }
              }
            }
            process.exit(bad ? 1 : 0);
          ' || exit 1

          # EVERY COMMONS SURFACE IS OFFERED FROM EVERY OTHER ONE. commons.js
          # renders the rail from ONE list, so a surface added there with no file
          # behind it is a dead link on every commons page at once — the same shape
          # as the kit-switcher hazard below, one floor down. Parse what the engine
          # actually shipped, never the list this file stages.
          co_hrefs=$(grep -oE 'href: *"[A-Za-z0-9._-]+"' HELIOS-BRIDGE/dist/commons/commons.js | sed 's/.*"\(.*\)"/\1/' | sort -u)
          [ -n "$co_hrefs" ] || { echo "FAIL: no surfaces parsed out of commons.js COMMONS_SURFACES"; exit 1; }
          for h in $co_hrefs; do
            test -f "HELIOS-BRIDGE/dist/commons/$h" \
              || { echo "FAIL: the commons rail offers $h from every commons page, and it is not in the artifact"; exit 1; }
          done
          echo "commons: $n_gear gear, $n_tips tips, $(echo "$co_hrefs" | wc -w | tr -d ' ') surfaces, deps resolve"

          # THE KIT SWITCHER OFFERS EVERY TRADES ROW FROM EVERY PAGE. It used to be
          # 7 words in 6 hub footers; it is now a chip grid in the nav dropdown that
          # all 32 pages carry, so a slug in that array with no staged directory is a
          # 404 reachable from the whole site at once — the /plumbing/credits.html
          # hazard above, multiplied by the switcher. Parse the array the RUNTIME
          # actually shipped rather than the TRADES list this file stages: checking
          # the staging list against itself would prove nothing, and the two drifting
          # apart is precisely the failure.
          sw_slugs=$(grep -oE 'slug: *"[a-z-]+"' HELIOS-BRIDGE/dist/shared/toolkit.js | sed 's/.*"\(.*\)"/\1/' | sort -u)
          [ -n "$sw_slugs" ] || { echo "FAIL: no slugs parsed out of the runtime's TRADES array"; exit 1; }
          for s in $sw_slugs; do
            test -f "HELIOS-BRIDGE/dist/$s/index.html" \
              || { echo "FAIL: the kit switcher offers /$s/ from every page of every trade, and it is not in the artifact"; exit 1; }
          done
          echo "kit switcher: $(echo "$sw_slugs" | wc -w | tr -d ' ') destinations, all staged"

          # A TRADE WITH A TOOLKIT AND NO CHIP IN THE COMMONS IS INVISIBLE THERE.
          # This is not hypothetical: framing shipped a full toolkit on 2026-08-09
          # and COMMONS_TRADES was never told, so for two days a framer opening the
          # page that calls itself "every trade" saw seven chips and none of them
          # were his — no error, no 404, nothing to notice. Breadth grows on its own
          # cadence and the commons is a separate file, so the two WILL drift again
          # unless the build refuses. A real trade is a switcher slug with a staged
          # trade.js, which excludes the commons entry itself (it has none, on
          # purpose) without hardcoding an exception.
          co_slugs=$(grep -oE 'slug: *"[a-z-]+"' HELIOS-BRIDGE/dist/commons/commons.js | sed 's/.*"\(.*\)"/\1/' | sort -u)
          [ -n "$co_slugs" ] || { echo "FAIL: no slugs parsed out of commons.js COMMONS_TRADES"; exit 1; }
          for s in $sw_slugs; do
            test -f "HELIOS-BRIDGE/dist/$s/trade.js" || continue
            echo "$co_slugs" | grep -qx "$s" \
              || { echo "FAIL: /$s/ has a toolkit but no chip in the commons — a whole trade cannot see itself on the page that claims to serve every trade. Add it to COMMONS_TRADES in commons/commons.js and give it rows in gear.js and tips.js."; exit 1; }
          done
          echo "commons trades: every staged toolkit has a chip"

          # Every trade dir must carry the four files that make the shared runtime
          # work (config + registry + hub + credit ledger). A trade staged without
          # them renders a bare page with no nav and a dead well — a silent break
          # the entry-point list above would not catch as the toolkit grows.
          #
          # credits.html is in this list because shared/toolkit.js buildBar() adds a
          # "Wall of Wishes -> credits.html" entry to the nav dropdown of EVERY page
          # of EVERY trade, with no per-trade guard. A trade without the page ships a
          # 404 to every one of its users. Measured live 2026-08-04: /plumbing/
          # credits.html -> 404 while /av/credits.html -> 200, for the entire life of
          # the plumbing toolkit. Asserting the page is how that stops recurring.
          for t in $TRADES; do
            for f in index.html trade.js tools.js credits.html credits.json; do
              test -f "HELIOS-BRIDGE/dist/$t/$f" || { echo "MISSING: $t/$f"; exit 1; }
            done
            grep -q 'shared/toolkit.js' "HELIOS-BRIDGE/dist/$t/index.html" \
              || { echo "FAIL: $t/index.html does not load the shared runtime"; exit 1; }

            # THE HUB WEARS ITS OWN COLOUR. Every hub is copied from a sibling and
            # its :root carries the sibling's --flag until somebody remembers —
            # doors shipped 2026-08-27 with painting's #29FF29 on its well button
            # and eyebrow and wore it for five days, found by the trade #16
            # backport sweep and by nothing else. The accent lives in trade.js;
            # the hub's --flag has to be the same hex, asserted on the artifact.
            hub_flag=$(grep -o -- '--flag:#[0-9A-Fa-f]\{6\}' "HELIOS-BRIDGE/dist/$t/index.html" | head -1 | sed 's/--flag://' | tr 'a-f' 'A-F')
            acc=$(grep -o 'accent: *"#[0-9A-Fa-f]\{6\}"' "HELIOS-BRIDGE/dist/$t/trade.js" | head -1 | sed 's/.*"\(#[^"]*\)"/\1/' | tr 'a-f' 'A-F')
            [ -n "$hub_flag" ] && [ -n "$acc" ] && [ "$hub_flag" = "$acc" ] \
              || { echo "FAIL: $t/index.html --flag ($hub_flag) is not the trade's accent ($acc) — a hub copied from a sibling kept the sibling's colour"; exit 1; }

            # THE REGISTRY MUST RESOLVE. tools.js is the one edit point that puts a
            # tool on the hub and in the nav; a href pointing at a missing or renamed
            # page ships green and 404s in a tech's hand. Assert every registry entry
            # against the ARTIFACT, not the repo. (Materialise before slicing — never
            # pipe into head under `set -o pipefail`; see the note above.)
            reg="$(mktemp)"
            grep -o 'href: *"[^"]*"' "HELIOS-BRIDGE/dist/$t/tools.js" \
              | sed 's/.*"\(.*\)"/\1/' > "$reg" || true
            n_reg=$(wc -l < "$reg" | tr -d ' ')
            while read -r href; do
              [ -n "$href" ] || continue
              case "$href" in http*|//*|/*) echo "FAIL: $t registry href is not relative: $href"; exit 1;; esac
              test -f "HELIOS-BRIDGE/dist/$t/$href" \
                || { echo "FAIL: $t/tools.js lists '$href' but HELIOS-BRIDGE/dist/$t/$href does not exist"; exit 1; }
            done < "$reg"
            echo "trade $t: $n_reg registry tool page(s), all resolve"

            # ...AND SO MUST EVERYTHING THOSE PAGES LOAD. Resolving the href only
            # proves the page exists, not that it works. Shape #2's engine
            # (shared/note.js + shared/note.css, 2026-08-05) made six tool pages
            # depend on files in a DIFFERENT staged directory: a page whose engine
            # or stylesheet 404s still returns 200 and still renders its header, so
            # it looks alive in a curl and is a blank white card in a foreman's
            # hand. That is the same class as the staged-but-unregistered scar
            # above, one level down, and only an assertion catches it.
            while read -r href; do
              [ -n "$href" ] || continue
              page="HELIOS-BRIDGE/dist/$t/$href"
              deps="$(mktemp)"
              grep -o -E '(src|href)="[^"]*\.(js|css)"' "$page" \
                | sed 's/.*"\(.*\)"/\1/' > "$deps" || true
              while read -r dep; do
                [ -n "$dep" ] || continue
                case "$dep" in http*|//*) echo "FAIL: $t/$href loads an OFF-SITE asset ($dep) — these pages are self-contained, no CDN"; exit 1;; esac
                case "$dep" in /*) echo "FAIL: $t/$href uses an origin-absolute asset path ($dep) — it breaks under the Pages sub-path"; exit 1;; esac
                ( cd "HELIOS-BRIDGE/dist/$t" && test -f "$dep" ) \
                  || { echo "FAIL: $t/$href loads '$dep' but it is not in the artifact — the page would render naked"; exit 1; }
              done < "$deps"
              echo "  $t/$href: $(wc -l < "$deps" | tr -d ' ') local asset(s) resolve"
            done < "$reg"

            # BOTH HALVES, ENFORCED. UIComponents.tsx's own header states that a
            # staged dir and a TOOLS entry are both required. Only one direction was
            # ever checked. Plumbing shipped 2026-08-03 staged-but-unregistered, so
            # the ONLY route to it on the whole site was a hand-wired link inside
            # av/index.html — verified against the deployed bundle 2026-08-04:
            # './av/' 1 hit, './plumbing/' 0 hits. Assert on the BUILT assets so this
            # proves what actually ships, not what the source says.
            grep -rqF "./$t/" HELIOS-BRIDGE/dist/assets/ \
              || { echo "FAIL: trade '$t' is staged but has NO entry in the site-root TOOLS registry (HELIOS-BRIDGE/components/UIComponents.tsx) — it would be unreachable from the front page"; exit 1; }

            # THE CROSS-BOUNDARY LOOP IS THREE MESSAGES AND ALL THREE ARE ONE PAGE
            # FILE COPIED PER TRADE. Loading a shared module is asserted above;
            # CALLING it is not, and the two drift independently — a trade whose
            # copy carries the <script> and lost the mount block ships a page that
            # renders everything except the block it exists to make (§SCARS
            # 2026-08-11, the same shape one floor down). Assert the whole loop
            # rather than the file: ask, answer, and reconcile the answer.
            if [ -f "HELIOS-BRIDGE/dist/$t/rough-in-request.html" ]; then
              test -f "HELIOS-BRIDGE/dist/$t/answer-back.html" \
                || { echo "FAIL: $t can ask across a boundary and cannot answer one — every trade is on BOTH ends of it on the same day"; exit 1; }
              grep -q 'shared/reconcile.js' "HELIOS-BRIDGE/dist/$t/rough-in-request.html" \
                || { echo "FAIL: $t/rough-in-request.html does not load shared/reconcile.js — the answer would have nowhere to land"; exit 1; }
              grep -q 'Reconcile.mount' "HELIOS-BRIDGE/dist/$t/rough-in-request.html" \
                || { echo "FAIL: $t/rough-in-request.html loads reconcile.js and never mounts it — the script is dead weight and the card never appears"; exit 1; }
              echo "  $t: ask -> answer -> reconcile, all three present"
            fi

            # THE HOLD TEST IS ITS ENGINE. Every other shape degrades to a form
            # when its engine is missing; this one degrades to NOTHING, because the
            # entire product is that the clock fills itself — a page carrying the
            # <script> and missing the mount block shows a dead readout, stamps no
            # times, and looks completely normal in a curl. Same assertion shape as
            # the reconcile loop above, one engine over.
            for p in evac-record.html its-holding.html; do
              [ -f "HELIOS-BRIDGE/dist/$t/$p" ] || continue
              grep -q 'shared/holdtest.js' "HELIOS-BRIDGE/dist/$t/$p" \
                || { echo "FAIL: $t/$p does not load shared/holdtest.js — the clock would never start"; exit 1; }
              grep -q 'HoldTest.mount' "HELIOS-BRIDGE/dist/$t/$p" \
                || { echo "FAIL: $t/$p loads holdtest.js and never mounts it — a dead readout that still returns 200"; exit 1; }
              echo "  $t/$p: hold-test engine mounted"
            done
          done

          # THE DOCUMENT LIBRARY HAS A CONTRACT WITH ITS ENGINE, AND NOTHING
          # CHECKED IT (§SCARS 2026-08-11). framing/docs.js shipped five documents
          # whose `omit` was a LIST where shared/docspec.js called .split on it —
          # a TypeError inside compose(), so the ONE THING that page exists to
          # produce, the block you paste into your AI, rendered EMPTY on the live
          # site for every one of that trade's own documents. The same file set
          # `family` to shared DOCUMENT IDS ("handover", "delay-notice"), which the
          # engine silently fell back to `recurring` for — so a damage letter read
          # three years later was being written as a DELTA against a previous one
          # that does not exist.
          #
          # Neither is visible to any check above: the file is valid JavaScript, the
          # page returns 200, its assets all resolve, and the layout is watertight
          # around an empty box. The contract is what has to be asserted, so it is.
          # FAMILIES is parsed OUT OF THE SHIPPED ENGINE rather than listed here —
          # a copy of the thing being checked drifts from it and then reports green
          # on the day it matters. Every trade is discovered from the artifact, so
          # trade #8 is covered the day it lands with no edit to this file.
          node -e '
            const fs = require("fs");
            const D = "HELIOS-BRIDGE/dist";
            const eng = fs.readFileSync(D + "/shared/docspec.js", "utf8");
            const FAM = [...eng.matchAll(/^\s{4}([a-z]+):\s*\{$/gm)].map(m => m[1]);
            if (FAM.length < 3) { console.error("FAIL: could not parse FAMILIES out of shared/docspec.js"); process.exit(1); }
            const trades = fs.readdirSync(D, { withFileTypes: true })
              .filter(d => d.isDirectory() && fs.existsSync(`${D}/${d.name}/docs.js`)).map(d => d.name).sort();
            if (!trades.length) { console.error("FAIL: no trade docs.js staged"); process.exit(1); }
            let bad = 0, n = 0;
            for (const t of trades) {
              const win = {};
              try { new Function("window", fs.readFileSync(`${D}/${t}/docs.js`, "utf8"))(win); }
              catch (e) { console.error(`FAIL: ${t}/docs.js does not parse: ${e.message}`); bad++; continue; }
              const L = win.TRADE_DOCS;
              if (!L || !Array.isArray(L.docs)) { console.error(`FAIL: ${t}/docs.js defines no TRADE_DOCS.docs`); bad++; continue; }
              if (typeof L.trade !== "string" || !L.trade.trim()) { console.error(`FAIL: ${t}/docs.js declares no trade word`); bad++; }
              /* A DOCUMENT declares all of these; an OVERRIDE declares only the
                 fields it changes and inherits the rest from the shared document
                 it overrides. So each field is checked only where it is present,
                 and `required` is what separates the two — an override that
                 restates just `sections` (framing does exactly that to the daily)
                 must not be failed for having no family of its own. */
              const check = (d, where, required) => {
                n++;
                if (required || "family" in d) {
                  if (!FAM.includes(d.family)) {
                    /* NO APOSTROPHES ANYWHERE IN THIS SCRIPT. It is delivered to
                       node inside a bash SINGLE-quoted string, so one typed into
                       a message ("the engine s") ends the quote and the shell
                       dies on the next paren — which is exactly how this step
                       failed the first time it ran. */
                    console.error(`FAIL: ${where} family "${d.family}" is not one of the five the engine declares (${FAM.join(", ")}) — it falls back silently and the continuity rule is wrong`);
                    bad++;
                  }
                }
                if (required || "omit" in d) {
                  const o = d.omit;
                  const okOmit = (typeof o === "string" && o.trim())
                    || (Array.isArray(o) && o.length && o.every(x => typeof x === "string" && x.trim()));
                  if (!okOmit) {
                    console.error(`FAIL: ${where} omit must be a non-empty string or a list of them (got ${Array.isArray(o) ? "an array with a bad member" : typeof o}) — this is the field the whole library is built around`);
                    bad++;
                  }
                }
                if ("standalone" in d && typeof d.standalone !== "boolean") {
                  console.error(`FAIL: ${where} standalone must be true/false`); bad++;
                }
                if ("sections" in d && (!Array.isArray(d.sections) || !d.sections.length
                    || d.sections.some(s => !s || typeof s.h !== "string" || typeof s.r !== "string"))) {
                  console.error(`FAIL: ${where} sections must be a non-empty list of {h,r} strings`); bad++;
                }
              };
              L.docs.forEach(d => check(d, `${t}/${d.id}`, true));
              Object.entries(L.overrides || {}).forEach(([id, o]) => check(o, `${t}/overrides.${id}`, false));
            }
            if (bad) { console.error(`docspec contract: ${bad} violation(s) across ${trades.length} trade(s)`); process.exit(1); }
            console.log(`docspec contract: ${n} document(s) across ${trades.length} trade(s) match the engine (families: ${FAM.join(", ")})`);
          '

          # THE POOLED VOCABULARY IS A DERIVED FILE, SO THE DEPLOY DERIVES IT AGAIN.
          # shared/docsindex.js is the union of every name and `aka` any of the
          # thirteen trades wrote for a document, added to the search index of every
          # trade that already carries that document — eight documents live on all
          # thirteen kits and every trade RENAMED them (delay-notice goes by seven
          # names), so without it a man searches ONE author's words for a document
          # thirteen men named. Measured through the real box before it was built:
          # 1,083 searches returned a DIFFERENT document for one the reader's own
          # library was holding, 512 of them with no hedge at all.
          #
          # A generated artifact whose correctness claim lives in its own header is
          # the scar this repo has already worn twice. One `aka` added to one trade's
          # docs.js silently makes the file stale, and nothing on any page looks
          # wrong. So it is REGENERATED HERE from the staged libraries, through the
          # engine's own exported merge and the search engine's own normalizer, and
          # ANY diff fails the build. There is no second copy of the rule to drift.
          node tools/toolkit-gates/build-docsindex.mjs --check --root=HELIOS-BRIDGE/dist \
            || { echo "FAIL: shared/docsindex.js is stale against the thirteen staged libraries"; exit 1; }

          # ...and the tag, on the REAL page with comments stripped. shared/docspec.js
          # reads window.DOCS_POOL and DEGRADES SILENTLY to the trade's own words when
          # it is absent: the page returns 200, renders identically, and quietly stops
          # knowing twelve other authors' vocabulary. This is the commons/tips.html
          # scar exactly — a shared engine reading a window.X a page must supply — and
          # that one survived a grep because the filename appeared in the comment
          # EXPLAINING its absence. Hence the strip.
          for wu in HELIOS-BRIDGE/dist/*/write-up.html; do
            [ -e "$wu" ] || continue
            perl -0pe 's/<!--.*?-->//gs' "$wu" | grep -q 'shared/docsindex.js' \
              || { echo "FAIL: $wu does not load shared/docsindex.js — its search silently narrows to one author's words"; exit 1; }
          done
          echo "pooled vocabulary: in step with the staged libraries, and loaded on every write-up page"

          # FEEDBACK IS BUILT IN — the standard, asserted rather than remembered
          # (operator 2026-08-04: "make sure we have a solid scalable way of
          # addressing open item wishes/feedback for anything — standardize the
          # process so anything that is made has this built in").
          #
          # Every surface we publish must give a user a way to report a bug, wish it
          # better, or ask for something. The trade toolkits get it from
          # shared/toolkit.js; everything else carries shared/feedback.js, the
          # framework-free drop-in. Collage Studio shipped for months with NO
          # feedback path at all — a grep for feedback|bug|report|contact across its
          # whole source returned nothing — which is precisely the kind of gap a
          # convention cannot catch and an assertion can.
          test -f HELIOS-BRIDGE/dist/shared/feedback.js \
            || { echo "MISSING: shared/feedback.js — the universal feedback well"; exit 1; }
          for surface in collage; do
            grep -q 'shared/feedback.js' "HELIOS-BRIDGE/dist/$surface/index.html" \
              || { echo "FAIL: /$surface/ ships with no way for a user to report a bug — add the two-line feedback drop-in (see shared/feedback.js)"; exit 1; }
            echo "feedback well present on: $surface"
          done

          # ...and the other direction: a trade dir on disk that nobody added to
          # TRADES is a toolkit that silently never deploys. Compare the two lists.
          for d in */trade.js; do
            [ -e "$d" ] || continue
            slug="${d%/trade.js}"
            case " $TRADES " in *" $slug "*) ;;
              *) echo "FAIL: $slug/ has a trade.js but is not in TRADES — it will never be staged"; exit 1;; esac
          done

          # THE THIRD LIST. shared/toolkit.js carries the sibling-trade list every
          # hub's footer renders from (added at trade #3, replacing the hard-wired
          # cross-links that did not survive a third trade). A slug in that array
          # with no staged dir is a dead link in the footer of EVERY page of EVERY
          # trade — the widest-blast-radius 404 this site can ship. Assert it
          # against the ARTIFACT, both directions, same as the two lists above.
          rt="$(mktemp)"
          sed -n '/var TRADES = \[/,/\];/p' HELIOS-BRIDGE/dist/shared/toolkit.js \
            | grep -o 'slug: *"[^"]*"' | sed 's/.*"\(.*\)"/\1/' > "$rt" || true
          test -s "$rt" || { echo "FAIL: could not read the TRADES array out of shared/toolkit.js"; exit 1; }
          while read -r slug; do
            [ -n "$slug" ] || continue
            test -d "HELIOS-BRIDGE/dist/$slug" \
              || { echo "FAIL: shared/toolkit.js lists trade '$slug' but no such dir is staged — dead footer link on every page"; exit 1; }
          done < "$rt"
          for t in $TRADES; do
            grep -qx "$t" "$rt" \
              || { echo "FAIL: trade '$t' is staged but missing from the TRADES array in shared/toolkit.js — no hub would link to it"; exit 1; }
          done
          echo "sibling-trade list: $(tr '\n' ' ' < "$rt")— matches staged trades"

          # The archive page is a gallery of standalone variation pages; if the
          # copy silently dropped them the index would still load and every card
          # would 404. Assert the population, not just the index.
          n_variations=$(find HELIOS-BRIDGE/dist/archive -name 'HELIOS-V*.html' | wc -l)
          echo "--- archive variations staged: $n_variations ---"
          test "$n_variations" -ge 400 || { echo "FAIL: archive looks truncated ($n_variations)"; exit 1; }

          echo "--- collage sw.js cache name (stamped per release, never frozen) ---"
          grep -m1 'const RAW_STAMP' HELIOS-BRIDGE/dist/collage/sw.js
          # POSITIVE assertion on the assignment, not absence-of-placeholder:
          # the placeholder name also appears in sw.js's header comment, so an
          # absence check reads the docs and fails a perfectly good build.
          if ! grep -qE 'const RAW_STAMP = "[0-9a-f]{12}";' HELIOS-BRIDGE/dist/collage/sw.js; then
            echo "FAIL: service worker was not stamped -- it would ship a frozen cache name"
            exit 1
          fi
          if ! grep -qE 'const RAW_PRECACHE = \["\./' HELIOS-BRIDGE/dist/collage/sw.js; then
            echo "FAIL: service worker precache list was not injected"
            exit 1
          fi

          echo "--- no origin-absolute src=/href= in collage index.html ---"
          if grep -nE '(src|href)="/' HELIOS-BRIDGE/dist/collage/index.html; then
            echo "FAIL: origin-absolute asset path would 404 under /collage/"
            exit 1
          fi

          # The three checks below close blind spots that were PROVEN by
          # rehearsing this gate against deliberately-broken trees: the
          # index.html-only scan above passed a tree with an absolute
          # start_url in manifest.json, a tree where the inline script had
          # regressed to register('/sw.js'), AND a tree whose main JS bundle
          # had been deleted. A gate that cannot catch the regression its own
          # pass was written to fix is decoration.

          echo "--- no origin-absolute URL member in collage manifest.json ---"
          if grep -nE '"(start_url|scope|action|src|url)"[[:space:]]*:[[:space:]]*"/' HELIOS-BRIDGE/dist/collage/manifest.json; then
            echo "FAIL: origin-absolute manifest member -- PWA scope/start_url would point at the domain root"
            exit 1
          fi

          echo "--- service worker is registered RELATIVE everywhere in the collage tree ---"
          # A root-anchored register() 404s here AND would claim the whole
          # origin as its scope, letting this tool intercept the sibling bridge.
          if grep -rnE "register\([[:space:]]*['\"]/" HELIOS-BRIDGE/dist/collage; then
            echo "FAIL: service worker registered at an origin-absolute path"
            exit 1
          fi

          echo "--- every asset referenced by collage/index.html exists in the artifact ---"
          # 200-on-index.html proves nothing if the bundle it points at is gone.
          # `|| true`: with `set -o pipefail` a no-match grep would abort the
          # step here and the explicit message below would never be reached.
          refs=$(grep -oE '(src|href)="\./[^"]+"' HELIOS-BRIDGE/dist/collage/index.html | sed -E 's/^(src|href)="\.\///; s/"$//' | sort -u || true)
          test -n "$refs" || { echo "FAIL: collage/index.html references no local assets at all"; exit 1; }
          for a in $refs; do
            test -f "HELIOS-BRIDGE/dist/collage/$a" || { echo "MISSING ASSET: collage/$a (referenced by collage/index.html)"; exit 1; }
            echo "  ok  collage/$a"
          done

          # THE NETWORK MANIFESTS ARE PUBLISHED, PARSE, AND SAY WHAT THEY CLAIM.
          #
          # Every other check in this step is DERIVED — it walks what the shipped
          # files reference and asserts each target exists. That derivation is
          # structurally blind to these files, and for a principled reason: a
          # well-known path has no referrer, which is what well-known means. So they
          # get an assertion of their own or they get nothing, and "nothing" is what
          # the root file had while it sat green at the repo root and 404'd on the web.
          #
          # FOUR failure modes, because only the first is obvious:
          #   deleted     — a staging line above was dropped or renamed, or a
          #                 per-surface file was removed at its source
          #   collapsed   — a per-surface file is byte-identical to the root one:
          #                 the copy door reopened and a project's url is publishing
          #                 the repo's manifest as its own (the 2026-08-13..19 state)
          #   unparseable — a manifest that 200s and does not parse is worse than
          #                 a 404: a crawler reads a level off a file it cannot
          #                 read, and criterion 4 asks for parsing, not presence
          #   mis-scoped  — a per-surface manifest whose wish_channel is not its own
          #                 page, or whose origin is null: the null is a positive
          #                 claim of no lineage, and the network refuses it for a
          #                 listed project
          # Checked at EVERY surface the network addresses, not just the root —
          # a card carries one URL and cannot walk up from it, so a manifest that
          # is present at the root and absent beside the page the chip opens is
          # still invisible to the holder of that card.
          for dest in "" av/ collage/; do
            f="HELIOS-BRIDGE/dist/${dest}wish-it-better.json"
            test -f "$f" \
              || { echo "FAIL: $f is not in the artifact — /$dest is a URL the network lists, and it is all a card holder or a crawler ever gets; a manifest that exists only in the repo is invisible to both"; exit 1; }
            if [ -n "$dest" ] && cmp -s wish-it-better.json "$f"; then
              echo "FAIL: $f is byte-identical to the repo-root manifest — the per-surface file collapsed back into a copy of the repo's"; exit 1
            fi
          done
          cmp -s wish-it-better.json HELIOS-BRIDGE/dist/wish-it-better.json \
            || { echo "FAIL: the root manifest in the artifact is not the repo-root original — one source for the root, and it drifted"; exit 1; }
          node -e '
            const fs = require("fs");
            /* NO APOSTROPHES IN THIS SCRIPT — see the docspec block above. */
            const SPEC = "wish-it-better/1.0";
            const SITE = "https://mrdirno.github.io/nested-resonance-memory-archive/";
            const seen = new Set();
            for (const dest of ["", "av/", "collage/"]) {
              const f = "HELIOS-BRIDGE/dist/" + dest + "wish-it-better.json";
              let m;
              try { m = JSON.parse(fs.readFileSync(f, "utf8")); }
              catch (e) { console.error("FAIL: " + f + " does not parse: " + e.message); process.exit(1); }
              /* Presence tested by key, not by truthiness: !m[k] reports a
                 present-but-empty level as MISSING, which sends the next reader
                 hunting for a field that is right there. */
              for (const k of ["spec", "level", "project", "wish_channel", "repo"]) {
                if (!(k in m) || typeof m[k] !== "string" || !m[k].trim()) {
                  console.error("FAIL: " + f + " has no usable " + k); process.exit(1);
                }
              }
              /* Criterion 4 is parsing AND declaring a level, so a level outside
                 the three the standard defines is a badge that means nothing.
                 WISH_IT_BETTER.md section 3: L0 Adopting, L1 Looping, L2
                 Networked. Cheap, and it is the field someone would raise by
                 hand to buy a better badge. */
              if (m.spec !== SPEC) { console.error("FAIL: " + f + " declares spec " + m.spec + ", not " + SPEC); process.exit(1); }
              if (!/^L[0-2]$/.test(m.level)) { console.error("FAIL: " + f + " declares level " + m.level + ", which is not one of L0/L1/L2"); process.exit(1); }
              /* Three manifests, three projects. Two files naming the same
                 project is the collapse above wearing a different byte. */
              if (seen.has(m.project)) { console.error("FAIL: " + f + " names project " + m.project + ", which another manifest in this artifact already names"); process.exit(1); }
              seen.add(m.project);
              if (dest) {
                /* A per-surface manifest speaks for ITS page: the wish channel is
                   that page (the sweep opens it and looks for the data-wish-well
                   marker), and origin is declared — null there is the claim that
                   nothing upstream exists, which the network refuses for a listed
                   project (vibe-cards tools/verify_pages_artifact.mjs, criterion 5). */
                if (!m.wish_channel.startsWith(SITE + dest)) { console.error("FAIL: " + f + " declares wish_channel " + m.wish_channel + ", which is not this surface (" + SITE + dest + ")"); process.exit(1); }
                if (typeof m.origin !== "string" || !m.origin.trim()) { console.error("FAIL: " + f + " declares no origin — a listed surface must say where it came from (criterion 5)"); process.exit(1); }
              }
              console.log("network manifest /" + dest + ": " + m.project + " " + m.level + " (" + m.spec + "), parses" + (dest ? ", per-surface, origin declared" : ", repo root, byte-identical to the original"));
            }
          ' || exit 1

          echo "artifact OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HELIOS-BRIDGE/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
