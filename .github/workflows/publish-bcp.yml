name: Publish BCP Library to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # The library release doctrine requires greater than 90% coverage.
      # Measure the WHOLE package, including optional monitor/visualization code.
      - name: Install library test dependencies
        run: python -m pip install './bcp_lib[dev,monitor,viz]'

      - name: Enforce library release evidence
        working-directory: ./bcp_lib
        run: python -m pytest tests --cov=bcp --cov-report=term-missing --cov-fail-under=90.01

      - name: Build package
        working-directory: ./bcp_lib
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bcp_lib/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
