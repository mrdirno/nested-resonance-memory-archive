function ParticleSystem({ config, digitRefs }) {

  const currentPosRef = useRef(0);

  const initParticles = (pos, col, vel) => {
    const gridSize = Math.ceil(Math.cbrt(MAX_PARTICLES));
    const spacing = SIMULATION_EXTENT / gridSize;
    const offset = SIMULATION_EXTENT / 2;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      const x = (i % gridSize) * spacing - offset;
      const y = (Math.floor(i / gridSize) % gridSize) * spacing - offset;
      const z = Math.floor(i / (gridSize * gridSize)) * spacing - offset;
      pos[i*3] = x + (Math.random()-0.5)*0.5;
      pos[i*3+1] = y + (Math.random()-0.5)*0.5;
      pos[i*3+2] = z + (Math.random()-0.5)*0.5;
      col[i*3]=1; col[i*3+1]=1; col[i*3+2]=1;
      vel[i*3]=0; vel[i*3+1]=0; vel[i*3+2]=0;
    }
  };

  const { positions, colors, velocities } = useMemo(() => {
    const pos = new Float32Array(MAX_PARTICLES * 3);
    const col = new Float32Array(MAX_PARTICLES * 3);
    const vel = new Float32Array(MAX_PARTICLES * 3);
    initParticles(pos, col, vel);
    return { positions: pos, colors: col, velocities: vel };
  }, []);

  useEffect(() => {
    if (config.resetTrigger > 0) {
      initParticles(positions, colors, velocities);
      if (meshRef.current) {
        meshRef.current.geometry.attributes.position.needsUpdate = true;
        meshRef.current.geometry.attributes.color.needsUpdate = true;
      }
    }
  }, [config.resetTrigger]);

  useEffect(() => {
    if (meshRef.current) meshRef.current.geometry.setDrawRange(0, config.particleCount);
  }, [config.particleCount]);

  useEffect(() => {
    velocitiesRef.current = velocities;
    currentPosRef.current = 0;
  }, [velocities]);

  const getDigit = (dimIndex, pos) => {
    let offset = 0, seqKey = '';
    if (dimIndex === 0) { offset = config.stagger.a; seqKey = config.mapping.a; }
    else if (dimIndex === 1) { offset = config.stagger.b; seqKey = config.mapping.b; }
    else { offset = config.stagger.c; seqKey = config.mapping.c; }
    const staggeredPos = Math.max(0, (pos + offset) % SEQUENCE_LENGTH);
    const seq = DIGIT_SEQUENCES[seqKey];
    if (!seq) return (staggeredPos + dimIndex) % 10;
    const digitChar = seq[staggeredPos % seq.length];
    return parseInt(digitChar || '0');
  };

  useFrame((state) => {
    if (!meshRef.current || !velocitiesRef.current) return;
    const now = state.clock.elapsedTime * 1000;
    const posAttr = meshRef.current.geometry.attributes.position;
    const colAttr = meshRef.current.geometry.attributes.color;
    const pos = posAttr.array;
    const cols = colAttr.array;
    const vels = velocitiesRef.current;

    if (config.isPlaying && now - lastFrameTimeRef.current > (1000 / config.speed)) {
      currentPosRef.current++;
      lastFrameTimeRef.current = now;
      if (digitRefs) {
        const m = getDigit(0, currentPosRef.current);
        const n = getDigit(1, currentPosRef.current);
        const p = getDigit(2, currentPosRef.current);
        const e = m*m + n*n + p*p;
        if (digitRefs.m.current) digitRefs.m.current.innerText = m.toString();
        if (digitRefs.n.current) digitRefs.n.current.innerText = n.toString();
        if (digitRefs.p.current) digitRefs.p.current.innerText = p.toString();
        if (digitRefs.pos.current) digitRefs.pos.current.innerText = currentPosRef.current.toLocaleString();
        if (digitRefs.energy.current) digitRefs.energy.current.innerText = e.toString();
      }
    }

    const mDigit = getDigit(0, currentPosRef.current);
    const nDigit = getDigit(1, currentPosRef.current);
    const pDigit = getDigit(2, currentPosRef.current);
    const energySum = mDigit*mDigit + nDigit*nDigit + pDigit*pDigit;
    const standardizedMode = energySum / 3;
    const waveNumber = Math.PI / SIMULATION_EXTENT;
    const phaseM = (mDigit/9)*Math.PI;
    const phaseN = (nDigit/9)*Math.PI;
    const phaseP = (pDigit/9)*Math.PI;

    const activeMode = config.mode;
    const { crystal, harmonic, topology } = config.extensions;
    const isCrystal = activeMode === 'crystal';
    const isHarmonic = activeMode === 'harmonic';
    const isTopology = activeMode === 'topology';
    const forceMultiplier = WAVE_STRENGTH * standardizedMode * config.amplitude;

    const getStrength = (val) => Math.pow(val, 4) * 20.0;
    const sThreeFold = getStrength(crystal.threeFold);
    const sSixFold = getStrength(crystal.sixFold);
    const sLattice = getStrength(crystal.lattice);
    const sComma = getStrength(harmonic.commaSpiral);
    const sFifths = getStrength(harmonic.perfectFifths);
    const sTrefoil = getStrength(topology.trefoil);
    const sTorus = getStrength(topology.torus);
    const sHopf = getStrength(topology.hopf);
    const spiralPhase = currentPosRef.current * 0.0011;
    const sCommaSin = sComma * Math.sin(spiralPhase);

    for (let i = 0; i < config.particleCount; i++) {
      const i3 = i * 3;
      let x = pos[i3], y = pos[i3+1], z = pos[i3+2];
      let forceX = 0, forceY = 0, forceZ = 0;

      if (sThreeFold > 0) {
        const r = Math.sqrt(x*x+y*y); const angle = Math.atan2(y,x);
        const snap = Math.round(angle/2.0944)*2.0944;
        forceX += (r*Math.cos(snap)-x)*sThreeFold; forceY += (r*Math.sin(snap)-y)*sThreeFold;
      }
      if (sSixFold > 0) {
        const r = Math.sqrt(x*x+y*y); const angle = Math.atan2(y,x);
        const snap = Math.round(angle/1.0472)*1.0472;
        forceX += (r*Math.cos(snap)-x)*sSixFold; forceY += (r*Math.sin(snap)-y)*sSixFold;
      }
      if (sLattice > 0) {
        const a = SIMULATION_EXTENT/3;
        forceX += (a*Math.round(x/a)-x)*sLattice; forceY += (a*0.866*Math.round(y/(a*0.866))-y)*sLattice;
      }
      if (sComma > 0) { forceX += y*sCommaSin; forceY += -x*sCommaSin; }
      if (sFifths > 0) {
        forceX += Math.sin(x*1.5*waveNumber)*sFifths;
        forceY += Math.sin(y*1.5*waveNumber)*sFifths;
        forceZ += Math.sin(z*1.5*waveNumber)*sFifths;
      }
      if (sTrefoil > 0) {
        const t = Math.atan2(y,x)*0.15915; const s = SIMULATION_EXTENT*0.5; const t2 = t*6.283;
        forceX += (s*(Math.sin(t2)+2*Math.sin(2*t2))-x)*sTrefoil;
        forceY += (s*(Math.cos(t2)-2*Math.cos(2*t2))-y)*sTrefoil;
        forceZ += (s*(-Math.sin(3*t2))-z)*sTrefoil;
      }
      if (sTorus > 0) {
        const R = SIMULATION_EXTENT*0.6; const r = SIMULATION_EXTENT*0.25;
        const theta = Math.atan2(y,x); const d = Math.sqrt(x*x+y*y);
        const phi = Math.atan2(z,d-R); const tr = R+r*Math.cos(phi);
        forceX += (tr*Math.cos(theta)-x)*sTorus; forceY += (tr*Math.sin(theta)-y)*sTorus;
        forceZ += (r*Math.sin(phi)-z)*sTorus;
      }

      const wx = mDigit*x*waveNumber+phaseM;
      const wy = nDigit*y*waveNumber+phaseN;
      const wz = pDigit*z*waveNumber+phaseP;
      const k = waveNumber * forceMultiplier * 0.1;
      forceX += (mDigit*Math.sin(wx)*Math.cos(wy)*Math.cos(wz))*k;
      forceY += (Math.cos(wx)*nDigit*Math.sin(wy)*Math.cos(wz))*k;
      forceZ += (Math.cos(wx)*Math.cos(wy)*pDigit*Math.sin(wz))*k;

      vels[i3] += forceX; vels[i3+1] += forceY; vels[i3+2] += forceZ;
      vels[i3] *= VELOCITY_DAMPING; vels[i3+1] *= VELOCITY_DAMPING; vels[i3+2] *= VELOCITY_DAMPING;
      x += vels[i3]; y += vels[i3+1]; z += vels[i3+2];

      const d2 = x*x+y*y+z*z;
      if (d2 > SIMULATION_EXTENT*SIMULATION_EXTENT) {
        const scale = SIMULATION_EXTENT/Math.sqrt(d2);
        x *= scale; y *= scale; z *= scale;
        vels[i3] *= -0.5; vels[i3+1] *= -0.5; vels[i3+2] *= -0.5;
      }
      pos[i3] = x; pos[i3+1] = y; pos[i3+2] = z;

      const brightness = config.quality * 0.7;
      if (isCrystal) {
        const an = (Math.atan2(y,x)+Math.PI)*0.15915;
        cols[i3]=0.3+an*brightness; cols[i3+1]=0.2+(1-an)*brightness*0.8; cols[i3+2]=0.4+Math.abs(z/SIMULATION_EXTENT)*brightness;
      } else if (isHarmonic) {
        const ph = (x+y+z)*0.1;
        cols[i3]=0.5+0.5*Math.sin(ph)*brightness; cols[i3+1]=0.5+0.5*Math.sin(ph+2.09)*brightness; cols[i3+2]=0.5+0.5*Math.sin(ph+4.18)*brightness;
      } else if (isTopology) {
        const r = Math.sqrt(x*x+y*y);
        cols[i3]=0.3+(r/SIMULATION_EXTENT)*brightness; cols[i3+1]=0.3+Math.abs(Math.sin(Math.atan2(y,x)*3))*brightness; cols[i3+2]=0.3+Math.abs(z/SIMULATION_EXTENT)*brightness;
      } else {
        cols[i3]=0.3+Math.abs(Math.cos(mDigit*x*0.2))*brightness;
        cols[i3+1]=0.2+Math.abs(Math.cos(nDigit*y*0.2))*brightness*0.8;
        cols[i3+2]=0.4+Math.abs(Math.cos(pDigit*z*0.2))*brightness*0.9;
      }
    }
    posAttr.needsUpdate = true; colAttr.needsUpdate = true;
  });

  const baseOpacity = 0.6 + (config.quality * 0.2);
  const densityFactor = Math.sqrt(config.particleCount / 10000);
  const opacity = Math.max(0.02, baseOpacity / densityFactor);
  const size = 0.08 * Math.sqrt(50000 / config.particleCount) * config.quality;

  return h('points', {ref: meshRef},
    h('bufferGeometry', null,
      h('bufferAttribute', {attach:'attributes-position', count:positions.length/3, array:positions, itemSize:3}),
      h('bufferAttribute', {attach:'attributes-color', count:colors.length/3, array:colors, itemSize:3})
    ),
    h('pointsMaterial', {vertexColors:true, size, transparent:true, opacity, blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false})
  );
}

// ══════════════════════════════════════════════════════════
// CAMERA CONTROLLER
// ══════════════════════════════════════════════════════════
function CameraController({ target, setTarget }) {
  const { camera, controls } = useThree();
  const vec = useMemo(() => new THREE.Vector3(), []);
  useFrame(() => {
    if (target) {
      vec.set(...target.position);
      camera.position.lerp(vec, 0.05);
      if (controls) controls.target.lerp(new THREE.Vector3(...target.target), 0.05);
      if (camera.position.distanceTo(vec) < 0.1) setTarget(null);
    }
  });
  return h(OrbitControls, {enableDamping:true, dampingFactor:0.05, minDistance:1, maxDistance:100, onStart:() => setTarget(null)});
}

function ExposureController({ exposure }) {
  const { gl } = useThree();
  useFrame(() => { gl.toneMappingExposure = exposure; });
  return null;
}

function ResponsiveCamera() {
  const { camera, size } = useThree();
  useEffect(() => {
    const aspect = size.width / size.height;
    camera.fov = aspect < 1 ? 100 : 60;
    camera.updateProjectionMatrix();
  }, [size, camera]);
  return null;
}

          h('div', {className:'text-tertiary font-bold text-sm mb-3'}, title),
          ...sliders.map(([label,key]) =>
            h('div', {key, className:'mb-2'},
              h('div',{className:'flex justify-between text-xs mb-1'}, h('span',null,label), h('span',{className:'font-mono text-primary'},Math.round(config.extensions[group][key]*100)+'%')),
              h('input', {type:'range', min:0, max:1, step:0.01, value:config.extensions[group][key],
                onChange:e=>setConfig(c=>({...c,extensions:{...c.extensions,[group]:{...c.extensions[group],[key]:parseFloat(e.target.value)}}})), className:'w-full'})
            )
          )
        )
      ),
      h('div', {className:'bg-black/30 p-4 rounded-xl border border-white/5 mb-4'},
        h('div', {className:'text-secondary font-bold text-sm mb-3'}, 'Pythagorean Harmonics'),
        ...[ ['Comma Spiral','commaSpiral'], ['Perfect Fifth Stack','perfectFifths'] ].map(([label,key]) =>
          h('div', {key, className:'mb-2'},
            h('div',{className:'flex justify-between text-xs mb-1'}, h('span',null,label), h('span',{className:'font-mono text-primary'},Math.round(config.extensions.harmonic[key]*100)+'%')),
            h('input', {type:'range', min:0, max:1, step:0.01, value:config.extensions.harmonic[key],
              onChange:e=>setConfig(c=>({...c,extensions:{...c.extensions,harmonic:{...c.extensions.harmonic,[key]:parseFloat(e.target.value)}}})), className:'w-full'})
          )
        )
      ),
      h('div', {className:'bg-black/30 p-4 rounded-xl border border-white/5'},
        h('div', {className:'text-primary font-bold text-sm mb-3'}, 'Topological Forms'),
        ...[ ['Trefoil Knot','trefoil',0.42], ['Toroidal Attractor','torus',1] ].map(([label,key,max]) =>
          h('div', {key, className:'mb-2'},
            h('div',{className:'flex justify-between text-xs mb-1'}, h('span',null,label), h('span',{className:'font-mono text-primary'},Math.round(config.extensions.topology[key]*100)+'%')),
            h('input', {type:'range', min:0, max, step:0.01, value:config.extensions.topology[key],
              onChange:e=>setConfig(c=>({...c,extensions:{...c.extensions,topology:{...c.extensions.topology,[key]:parseFloat(e.target.value)}}})), className:'w-full'})
          )
        )
      )
    ),

    // Camera Panel
    h(Panel, {title:'Camera Control', subtitle:'Navigate N-particle phase space', active:activePanel==='camera', onClose:()=>setActivePanel(null)},
      h('div', {className:'grid grid-cols-2 gap-3 mb-6'},
        ...[ ['Top View',[0,30,0.1]], ['Side View',[30,0,0]], ['Isometric',[20,20,20]], ['Core View',[0.1,0.1,0.1]] ].map(([label,pos]) =>
          h('button', {key:label, onClick:()=>setCameraTarget({position:pos,target:[0,0,0]}), className:'p-4 bg-white/5 border border-white/10 hover:bg-primary/20 hover:border-primary/50 rounded-xl text-sm font-bold transition'}, label)
        )
      ),
      h('button', {onClick:()=>setCameraTarget({position:[20,10,20],target:[0,0,0]}), className:'w-full py-4 rounded-xl font-bold text-sm text-white shadow-lg bg-gradient-to-br from-secondary to-pink-600'}, 'Reset Camera')
    ),

    // Navigation Bar
    h('div', {className:'fixed bottom-0 left-0 w-full h-[80px] bg-glass backdrop-blur-xl border-t border-white/10 flex justify-around items-center px-4 z-50'},
      h(NavItem, {icon:h(SettingsIcon,{size:24}), label:'Control', active:activePanel==='controls', onClick:()=>setActivePanel(activePanel==='controls'?null:'controls')}),
      h(NavItem, {icon:h(WavesIcon,{size:24}), label:'Fields', active:activePanel==='waves', onClick:()=>setActivePanel(activePanel==='waves'?null:'waves')}),
      h(NavItem, {icon:h(FlaskIcon,{size:24}), label:'Labs', active:activePanel==='labs', onClick:()=>setActivePanel(activePanel==='labs'?null:'labs')}),
      h(NavItem, {icon:h(CameraIcon,{size:24}), label:'Camera', active:activePanel==='camera', onClick:()=>setActivePanel(activePanel==='camera'?null:'camera')})
    )
  );
}

// ══════════════════════════════════════════════════════════
// MOUNT
// ══════════════════════════════════════════════════════════
const root = createRoot(document.getElementById('root'));
root.render(h(React.StrictMode, null, h(App)));
</script>
</body>
</html>
