# BittWare S5 FPGA Driver Configuration File
# This file contains configuration parameters for the BittWare S5 driver

[device]
# Device identification
vendor_id = 0x1172
device_id = 0x0005
max_devices = 4

# PCIe configuration
pcie_gen = 3
pcie_lanes = 8
max_payload_size = 4096
max_read_request_size = 4096

[memory]
# DDR3 memory configuration
ddr3_size = 34359738368  # 32GB in bytes
ddr3_base = 0x100000000  # 4GB offset
page_size = 4096
alignment = 4096

# Memory test parameters
memory_test_enable = true
memory_test_size = 1048576  # 1MB
memory_test_patterns = 0x00000000,0xFFFFFFFF,0x55555555,0xAAAAAAAA

[dma]
# DMA engine configuration
num_channels = 4
max_transfer_size = 16777216  # 16MB
descriptor_ring_size = 256
buffer_pool_size = 134217728  # 128MB

# DMA performance tuning
use_msi = true
interrupt_coalescing = true
timeout_ms = 5000

[network]
# Network interface configuration
num_interfaces = 2
interface_type = 10gbe
mtu = 9000
enable_jumbo_frames = true

# Network performance tuning
rx_ring_size = 512
tx_ring_size = 512
napi_weight = 64
enable_checksum_offload = true

[interrupts]
# Interrupt configuration
use_msi_x = true
num_vectors = 8
interrupt_mode = shared

# Interrupt coalescing
rx_usecs = 50
tx_usecs = 50
rx_max_frames = 32
tx_max_frames = 32

[debugging]
# Debug and logging options
debug_level = 1  # 0=off, 1=errors, 2=warnings, 3=info, 4=debug
enable_tracing = false
log_dma_transfers = false
log_interrupts = false

# Performance monitoring
enable_stats = true
stats_interval = 60  # seconds

[power]
# Power management
enable_runtime_pm = false
d3cold_capable = false
aspm_policy = performance  # performance, powersave, default

[firmware]
# Firmware configuration
auto_load_firmware = true
firmware_path = /lib/firmware/bittware/s5/
default_bitstream = bittware_s5_default.bit

# Firmware validation
verify_checksum = true
require_signed = false

[compatibility]
# Compatibility settings
linux_min_version = 4.4.0
gcc_min_version = 4.9
strict_mode = false

[security]
# Security settings
allow_user_access = true
require_root_for_dma = true
enable_iommu = true