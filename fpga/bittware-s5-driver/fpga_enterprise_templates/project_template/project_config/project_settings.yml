# Enterprise FPGA Project Configuration
# Template for production-ready FPGA development

project:
  name: "enterprise_fpga_project"
  version: "1.0.0"
  description: "Enterprise FPGA application"
  client: "client_name"
  project_value: "$150K/month"
  
target:
  vendor: "xilinx"  # xilinx, intel, microsemi, lattice
  family: "ultrascale_plus"
  device: "xczu9eg-ffvb1156-2-e"
  package: "ffvb1156"
  speed_grade: "-2"
  
design:
  top_module: "top_level"
  clock_frequency: 250  # MHz
  target_utilization: 80  # Percentage
  timing_margin: 0.5  # ns
  
tools:
  synthesis: "vivado"  # vivado, quartus, synplify
  simulator: "xsim"    # xsim, modelsim, questa
  version_control: "git"
  
paths:
  rtl_source: "./rtl"
  ip_cores: "./ip"
  constraints: "./constraints"
  testbench: "./testbench"
  scripts: "./scripts"
  output: "./build"
  
quality:
  code_coverage_target: 95
  timing_closure_required: true
  power_analysis_required: true
  resource_utilization_limit: 85
  
enterprise:
  documentation_required: true
  code_review_required: true
  formal_verification: true
  regression_testing: true
  release_management: true