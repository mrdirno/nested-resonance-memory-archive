<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumables List</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Consumables">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#242A31">
<style>
:root{
  --steel:#242A31;
  --ink:#12161A;
  --zinc:#D7DAD3;
  --paper:#FBFBF8;
  --line:#BABEB6;
  --muted:#5D656E;
  --flag:#F0BE1E;
  --tint:#FDF7E1;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond: "Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow","Roboto Condensed",var(--sans);
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--zinc);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.4;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 140px}

/* ---------- masthead ---------- */
.plate{
  background:var(--steel);
  color:#EEF0EA;
  margin:0 -16px 22px;
  padding:16px 16px 14px;
}
.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--flag);
  display:block;
  margin-bottom:6px;
}
.plate h1{
  font-family:var(--cond);
  font-weight:700;
  font-size:clamp(19px,4.4vw,28px);
  letter-spacing:.02em;
  text-transform:uppercase;
  margin:0;
  line-height:.95;
}
.lede{margin:7px 0 0;max-width:52ch;color:#B9BFC6;font-size:12.5px}

.jobfields{
  display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;
  padding-top:12px;border-top:1px solid #3A424B;
}
.field{flex:1 1 170px;min-width:150px}
.field span{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#8E97A1;margin-bottom:5px;
}
.field input,.field select{
  width:100%;background:#171C22;border:1px solid #3A424B;color:#EEF0EA;
  font-family:var(--cond);font-size:14px;letter-spacing:.02em;padding:6px 9px;border-radius:2px;
}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--flag);outline-offset:1px}
.needby{display:flex;gap:6px}
.needby select{flex:1}
.needby input[type=date]{flex:1;min-width:0;color-scheme:dark}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:18px;
}
.search{
  flex:1 1 260px;position:relative;
}
.search input{
  width:100%;padding:10px 12px 10px 34px;border:1px solid var(--steel);
  /* 16, never 14: below 16 iOS Safari zooms the page on focus and the layout
     that must not alter when zoomed out does exactly that. This box shipped
     at 14 — the reference implementation is the file nobody re-measures. */
  background:var(--paper);border-radius:2px;font-family:var(--sans);font-size:16px;color:var(--ink);
}
.search::before{
  content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;
  margin-top:-7px;border:2px solid var(--muted);border-radius:50%;
}
.search::after{
  content:"";position:absolute;left:21px;top:50%;width:7px;height:2px;
  background:var(--muted);transform:rotate(45deg);margin-top:2px;
}
.btn{
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:14px;
  padding:10px 14px;border:1px solid var(--steel);background:transparent;color:var(--steel);
  border-radius:2px;cursor:pointer;min-height:44px;
}
.btn:hover{background:var(--steel);color:#EEF0EA}
.btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.opt{
  display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;
}
.opt input{accent-color:var(--steel);width:15px;height:15px}

/* ---------- categories ---------- */
.cat{
  background:var(--paper);
  border:1px solid var(--line);
  border-left:5px solid var(--chip,var(--steel));
  border-radius:2px;
  margin-bottom:14px;
  overflow:hidden;
}
.cat-head{
  display:flex;align-items:baseline;gap:10px;
  padding:12px 14px 10px;border-bottom:1px solid var(--line);
}
.cat-head h2{
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;
  font-size:15px;font-weight:700;margin:0;flex:1;
}
.tally{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.mini{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--muted);
  padding:4px 7px;border-radius:2px;cursor:pointer;min-height:44px;min-width:44px;
}
.mini:hover{border-color:var(--steel);color:var(--steel)}
.mini:focus-visible{outline:2px solid var(--flag);outline-offset:1px}

ul.items{list-style:none;margin:0;padding:0}
.item{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:6px 13px;border-top:1px solid #E7E7E1;
  transition:background .12s ease;
}
.item:first-child{border-top:0}
.item.is-checked{background:var(--tint)}
.item.is-hidden{display:none}
.cat.is-hidden{display:none}

.row{display:flex;align-items:center;gap:11px;flex:1 1 320px;cursor:pointer;min-width:0;min-height:44px}
.tick{
  appearance:none;-webkit-appearance:none;flex:none;
  width:20px;height:20px;border:2px solid var(--steel);border-radius:2px;
  background:var(--paper);cursor:pointer;position:relative;margin:0;
}
.tick:checked{background:var(--steel)}
.tick:checked::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:11px;
  border:solid var(--flag);border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.tick:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

.body{min-width:0}
.name{
  display:block;font-family:var(--cond);font-size:15px;letter-spacing:.01em;
  color:var(--muted);
}
.is-checked .name{color:var(--ink);font-weight:700}
.spec{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}

.fields{display:flex;gap:8px;align-items:center;margin-left:auto}
/* 44px, MEASURED, on the page this program cites as its own quality bar. This
   is the ORIGINAL shape #1 page — the one shared/checklist-request.js was
   extracted FROM — and it kept its own CSS, so every sweep that fixed the engine
   pages went past it. Driven live in a 390px frame 2026-08-14 while standing up
   trade #10: SIXTY controls under the operator's tap law on one page —
   28 x .qty at 33px, 28 x .note at 32px, the .kill at 30px, and four header
   fields at 30-39px. The engine-based pages measured clean at the same widths in
   the same pass, which is exactly why this one was never caught: the reference
   implementation is the file nobody re-measures. */
.qty{
  width:58px;padding:7px 6px;text-align:center;font-family:var(--mono);font-size:14px;
  border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);
  min-height:44px;
}
.note{
  width:150px;padding:7px 9px;font-size:13px;border:1px solid var(--line);
  border-radius:2px;background:#fff;color:var(--ink);
  min-height:44px;
}
.field input,.field select,#q,#newItem,#fNeedDate{min-height:44px}
.qty:focus-visible,.note:focus-visible{outline:2px solid var(--flag);outline-offset:1px}
.kill{
  border:1px solid var(--line);background:none;color:var(--muted);
  width:44px;height:44px;border-radius:2px;cursor:pointer;font-size:16px;line-height:1;
}
.kill:hover{border-color:#C4342B;color:#C4342B}

.empty{padding:14px;color:var(--muted);font-size:13.5px}
.addbar{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #E7E7E1}
.addbar input{
  flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:2px;
  font-size:14px;background:#fff;color:var(--ink);
}
.addbar input:focus-visible{outline:2px solid var(--flag);outline-offset:1px}

#nomatch{display:none;padding:26px 4px;color:var(--muted);font-family:var(--cond);
  font-size:19px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- yesterday's list ---------- */
.lastwrap{margin:0 0 14px}
.lastbtn{width:100%;min-height:44px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;
  font-size:14px;font-weight:700;background:var(--paper);border:1px dashed var(--steel);color:var(--steel);
  border-radius:2px;padding:11px 12px;cursor:pointer}
.lastbtn:hover{background:var(--tint)}
.lastbtn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

/* ---------- WHAT YOU SEND ----------
 * The house block every other order page on the rack has shipped since the
 * engine was extracted, and the one this page never got. It is not decoration:
 * tools/toolkit-gates/order-live-header.mjs finds shape #1 pages by looking for
 * #list + #preview + #copy + #clear, so for this page's whole life the gate
 * named THE PREVIEW IS THE DOCUMENT counted twelve order pages, went green, and
 * could not see the thirteenth — the only one with nothing on the glass at all.
 * A gate cannot fail a page it cannot find; it just prints a smaller number.
 * The rule is the same one the .preview block on av/cable-list.html ships:
 * break-word, because a jobsite typed as one long unbroken string is the token
 * that puts a horizontal scrollbar on a 320px phone (§MOBILE-WATERTIGHT). */
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.preview{background:#fff;border:1px solid var(--line);border-radius:2px;padding:12px;
  font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;
  color:var(--ink);max-height:340px;overflow:auto}

/* ---------- dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;background:var(--steel);
  border-top:3px solid var(--flag);z-index:20;
}
.dock-in{
  max-width:1080px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.readout{flex:1;min-width:130px;display:flex;align-items:baseline;gap:9px}
.readout b{font-family:var(--mono);font-size:22px;color:var(--flag);line-height:1;font-weight:600}
.readout span{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9BA4AE;
}
.dock .btn{border-color:#59626C;color:#DDE1E6}
.dock .btn:hover{background:#333B44;color:#fff}
.dock .btn.go{background:var(--flag);border-color:var(--flag);color:#231B00;font-weight:700}
.dock .btn.go:hover{background:#FFD34A;border-color:#FFD34A;color:#231B00}
.dock .btn.go[disabled]{opacity:.35;cursor:not-allowed;background:var(--flag);color:#231B00}

@media (max-width:620px){
  .fields{margin-left:31px;width:100%}
  .note{flex:1;width:auto}
  .row{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

</style>
</head>
<body>

<div class="wrap">

  <header class="plate">
    <span class="eyebrow">Field stock</span>
    <h1>Consumables List</h1>
    <p class="lede">Tick what you&rsquo;re out of, set counts, then copy the list into chat.</p>
    <div class="jobfields">
      <label class="field"><span>Jobsite</span><input id="fJob" type="text" placeholder="&mdash;"></label>
      <label class="field"><span>Requested</span><input id="fReq" type="text" autocomplete="off"></label>
      <div class="field"><span>Need by</span>
        <div class="needby">
          <select id="fNeedSel" aria-label="Need by">
            <option value="asap">ASAP</option>
            <option value="date">Pick a date&hellip;</option>
          </select>
          <input id="fNeedDate" type="date" hidden aria-label="Need-by date">
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <input id="q" type="search" placeholder="Filter items &mdash; try &ldquo;screw&rdquo; or &ldquo;RJ45&rdquo;" aria-label="Filter items">
    </div>
    <button class="btn" id="checkShown" type="button">Check shown</button>
  </div>

  <p class="lastwrap" id="lastwrap" style="display:none">
    <button type="button" class="lastbtn" id="last">&#8635; Start from last list</button>
  </p>

  <main id="list"></main>
  <p id="nomatch" aria-live="polite">No items match that filter.</p>

  <p class="section-label">What you send</p>
  <div class="preview" id="preview"></div>

</div>

<div class="dock" data-fixed-bar>
  <div class="dock-in">
    <div class="readout"><b id="count">00</b><span id="countLabel">items needed</span></div>
    <button class="btn" id="clear" type="button">Clear all</button>
    <button class="btn go" id="copy" type="button" disabled>Copy for chat</button>
  </div>
</div>

<script src="../shared/draft.js"></script>
<script src="../shared/find.js"></script>
<script src="../shared/pickfilter.js"></script>
<script>
const DATA = [
  { id:"tape", name:"Tapes & Adhesives", chip:"#2E64C8", items:[
    ["Electrical Tape (E-Tape)","Vinyl electrical tape, assorted colors"],
    ["Blue Painter's Tape","Low-tack surface protection and temporary positioning"]
  ]},
  { id:"fast", name:"Fasteners & Anchors", chip:"#C4342B", items:[
    ["Wall Dogs","All-in-one threaded drywall/masonry anchors"],
    ["Black Pan Head — Self-Tapper (Sheetrock)","Sheetrock screw for METAL STUD — small black Phillips pan-head, sharp self-tapping point (Home Depot)"],
    ["Black Pan Head — Regular (Sheetrock)","Sheetrock screw for WOOD / no stud — small black Phillips pan-head, standard point, NOT self-tapping (Home Depot)"],
    ["Self-Drilling Screws","Sheet metal and metal stud fastening — self-tappers"],
    ["Standard Rack Screws","Standard #10-32 rack screws"],
    ["Large Cage Nuts & Screws","M6 rack cage nuts and screws (slightly larger/thicker)"],
    ["Strap Toggle Anchors","1/4\"-20 plastic strap toggles (the blue box)"],
    ["Concrete Screws","Masonry and slab mounting"]
  ]},
  { id:"bits", name:"Drill Bits", chip:"#1B1B1B", items:[
    ["3/16\" Drill Bits","Impact rated / hex shank style"],
    ["Unibit / Step Bit","Up to 1/2\" — Milwaukee Shockwave or similar impact style"]
  ]},
  { id:"cable", name:"Cable Management & Dress", chip:"#2E7D4F", items:[
    ["Velcro Roll (Hook-and-Loop)","Continuous roll for cable bundling"],
    ["Adhesive-Backed Industrial Velcro","Mounting gear, power bricks, and receivers"],
    ["Cable Ties","Standard (4\", 8\", 11\") and UV-resistant outdoor ties"],
    ["Adhesive Tie Mounts (Sticky Backs)","Screw-mount and adhesive cable anchors"],
    ["Heat Shrink Tubing","Assorted diameters for strain relief and wire isolation"],
    ["Split Mesh Sleeving","1/2 inch and 1 inch"],
    ["Non-Split Mesh Sleeving","1/2 inch and 1 inch"],
    ["Cable Split Loom",""]
  ]},
  { id:"label", name:"Labeling & Marking", chip:"#E0A800", items:[
    ["Label Maker Cartridges","White with black font — Brady M21 series & Brother P-Touch TZe tape"],
    ["Permanent Markers","Pack of Milwaukee Inkzall markers"],
    ["Paint Pen","White paint pen"]
  ]},
  { id:"term", name:"Terminations & Miscellaneous", chip:"#7A3FA8", items:[
    ["RJ45 Shielded Male Connectors","Shielded pass-through/standard RJ45 plugs with boots (Nelson bag)"],
    ["RJ45 Non-Shielded Male Connectors","Typical unshielded RJ45 plugs with boots"],
    ["Red Butt Splices","22-16 AWG crimp connectors"],
    ["Blue Butt Splices","16-14 AWG crimp connectors"],
    ["Twist-On Wire Connectors","The twist-ons — standard assorted sizes"]
  ]},
  { id:"writein", name:"Write-Ins", chip:"#5D656E", items:[], writein:true }
];

const list = document.getElementById("list");

/* Assigned at the bottom, once the list and the header both exist. Declared here
   because refresh() runs during the build and must not throw on the way past. */
var draft = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function itemHTML(name, spec, removable){
  return `<li class="item">
      <label class="row">
        <input type="checkbox" class="tick" aria-label="${esc(name)}">
        <span class="body">
          <span class="name">${esc(name)}</span>
          ${spec ? `<span class="spec">${esc(spec)}</span>` : ""}
        </span>
      </label>
      <div class="fields">
        <input class="qty" type="number" min="1" step="1" value="1" aria-label="Quantity — ${esc(name)}">
        <input class="note" type="text" placeholder="size / note" maxlength="28" aria-label="Note — ${esc(name)}">
        ${removable ? `<button class="kill" type="button" title="Remove line" aria-label="Remove ${esc(name)}">&times;</button>` : ""}
      </div>
    </li>`;
}

list.innerHTML = DATA.map(cat => `
  <section class="cat" id="cat-${cat.id}" style="--chip:${cat.chip}">
    <div class="cat-head">
      <h2>${esc(cat.name)}</h2>
      <span class="tally" data-tally>0 / ${cat.items.length}</span>
      ${cat.writein ? "" : `<button class="mini" type="button" data-all>All</button>`}
    </div>
    <ul class="items">${cat.items.map(i => itemHTML(i[0], i[1], false)).join("")}</ul>
    ${cat.writein ? `
      <p class="empty" data-empty>Nothing added yet. Anything the list is missing goes here.</p>
      <div class="addbar">
        <input id="newItem" type="text" placeholder="Add an item — e.g. 3/4&quot; EMT straps" maxlength="60">
        <button class="btn" id="addBtn" type="button">Add</button>
      </div>` : ""}
  </section>
`).join("");

const writeUL = document.querySelector("#cat-writein ul.items");
const emptyMsg = document.querySelector("#cat-writein [data-empty]");

function refresh(){
  let total = 0;
  document.querySelectorAll(".cat").forEach(cat => {
    const items = [...cat.querySelectorAll(".item")];
    const on = items.filter(i => i.querySelector(".tick").checked);
    total += on.length;
    cat.classList.toggle("has-checked", on.length > 0);
    const t = cat.querySelector("[data-tally]");
    if (t) t.textContent = `${on.length} / ${items.length}`;
  });
  if (emptyMsg) emptyMsg.style.display = writeUL.children.length ? "none" : "";
  document.getElementById("count").textContent = String(total).padStart(2,"0");
  document.getElementById("countLabel").textContent = total === 1 ? "item needed" : "items needed";
  document.getElementById("copy").disabled = total === 0;
  /* THE PREVIEW IS asText() ITSELF, NOT A SECOND RENDERER.
   * Every other order page builds its preview and its clipboard text from the
   * same config but through two paths, which is exactly why order-live-header
   * has to exist: a field wired into one and not the other makes the block he
   * PROOFREADS a generation stale, and the one thing he checks before sending
   * is the one thing that lies. Here there is one function and the block is its
   * output, so the two cannot drift — the gate's first assertion is true by
   * construction rather than by inspection.
   * And it is what makes the sticky jobsite honest. That box survives Clear on
   * purpose (Clear means "different order", not "different job") but it also
   * survives a WEEK, and until now nothing on the glass said so: he stood in the
   * warehouse and sent CONSUMABLES NEEDED — <last week's job> to the counter,
   * and it read exactly like a right order. It is on line one of the block now,
   * above the first thing he ticked. */
  var pv = document.getElementById("preview");
  if (pv) pv.textContent = asText();
  if (draft) draft.save();
}

/* THE COUNT AND THE NOTE REPAINT TOO — and this page had never bound them.
 * Ticking a line was the only thing that ever redrew anything here, because
 * until this cycle there was nothing on the glass to redraw: the count in the
 * dock only ever changed when a line went on or off. The moment the document
 * went up, the last number he typed became the one thing that lied — driven at
 * 390px, the block read "Wall Dogs x1" while the copy button sent "x8", because
 * the tick that repainted came BEFORE the quantity he then typed into it. That
 * is the same defect order-live-header.mjs was written for, one row lower down
 * than it is allowed to look (it skips everything inside #list on purpose).
 * Delegated, so write-in rows added later are covered by the same two lines. */
document.addEventListener("input", e => {
  if (e.target.closest("#list") && (e.target.classList.contains("qty") || e.target.classList.contains("note"))) refresh();
});

document.addEventListener("change", e => {
  if (e.target.classList.contains("tick")){
    const item = e.target.closest(".item");
    item.classList.toggle("is-checked", e.target.checked);
    const qty = item.querySelector(".qty");
    if (e.target.checked && !qty.value) qty.value = 1;
    refresh();
  }
});

document.addEventListener("click", e => {
  const all = e.target.closest("[data-all]");
  if (all){
    const items = [...all.closest(".cat").querySelectorAll(".item")].filter(i => !i.classList.contains("is-hidden"));
    const turnOn = items.some(i => !i.querySelector(".tick").checked);
    items.forEach(i => { i.querySelector(".tick").checked = turnOn; i.classList.toggle("is-checked", turnOn); });
    refresh();
  }
  if (e.target.classList.contains("kill")){
    e.target.closest(".item").remove();
    refresh();
  }
});

/* THE FILTER AND ITS "CHECK SHOWN" ARE shared/pickfilter.js NOW.
   This page is where both were proved, and it kept its own copy of the glue —
   which is a fork the moment a second page wants it, and six of them wanted it.
   The markup and the CSS here are untouched: the module ADOPTS #q, #nomatch and
   #checkShown rather than rendering its own bar, so not a pixel moves and this
   page inherits the two fixes the extraction carried — the write-in section is
   no longer filtered off the page along with everything else, and "Check shown"
   only exists while something is actually being held back (with an empty box it
   meant "tick all of them", one thumb, no confirm). */
const pf = PickFilter.mount({
  list: "list", input: "q", label: "nomatch", check: "checkShown",
  onCheckShown: refresh
});

document.getElementById("clear").addEventListener("click", () => {
  /* Clear goes through the keeper so the list about to die lands in the "last"
     slot first, and so the record is dropped instead of being rewritten by the
     pending debounce a quarter-second later (§SCARS "clear must actually clear"). */
  const wipe = () => {
    /* Write-ins are removable rows: clearing must REMOVE them, not untick them,
       or the next list starts with yesterday's duplicates sitting unticked in the
       middle of it. Backported from the engine's clearAll(). */
    document.querySelectorAll("#cat-writein .item").forEach(i => i.remove());
    document.querySelectorAll(".tick").forEach(t => { t.checked = false; t.closest(".item").classList.remove("is-checked"); });
    document.querySelectorAll(".qty").forEach(q => q.value = 1);
    document.querySelectorAll(".note").forEach(n => n.value = "");
    /* Need-by is an answer about THIS list, so the next list starts at ASAP
       rather than inheriting last Tuesday's date. The jobsite is not: it lives in
       its own sticky record and Clear never touches it. */
    fNeedSel.value = "asap";
    fNeedDate.hidden = true;
    fNeedDate.value = "";
    reqTouched = false;
    setReq();
  };
  if (draft) draft.clear(wipe); else wipe();
  // A wiped list still filtered down to three rows reads as a broken page.
  if (pf) pf.reset();
  refresh();
  showLast();
});

function addWriteIn(){
  const input = document.getElementById("newItem");
  const v = input.value.trim();
  if (!v) { input.focus(); return; }
  writeUL.insertAdjacentHTML("beforeend", itemHTML(v, "", true));
  const li = writeUL.lastElementChild;
  li.querySelector(".tick").checked = true;
  li.classList.add("is-checked");
  input.value = "";
  input.focus();
  refresh();
}
document.getElementById("addBtn").addEventListener("click", addWriteIn);
document.getElementById("newItem").addEventListener("keydown", e => { if (e.key === "Enter") addWriteIn(); });

function asText(){
  const job = document.getElementById("fJob").value.trim();
  const req = document.getElementById("fReq").value.trim();
  let out = "CONSUMABLES NEEDED";
  if (job) out += " — " + job;
  out += "\nRequested: " + (req || todayStr()) + " · Need by: " + needByText() + "\n";
  document.querySelectorAll(".cat").forEach(c => {
    const on = [...c.querySelectorAll(".item")].filter(i => i.querySelector(".tick").checked);
    if (!on.length) return;
    out += "\n" + c.querySelector("h2").textContent.toUpperCase() + "\n";
    on.forEach(i => {
      const q = (i.querySelector(".qty").value || "1").trim();
      const n = i.querySelector(".note").value.trim();
      out += "- " + i.querySelector(".name").textContent
           + " x" + (q || "1")
           + (n ? " (" + n + ")" : "") + "\n";
    });
  });
  return out.trim();
}

const copyBtn = document.getElementById("copy");
/* Send: the same asText(), through the share sheet (C3698). This page loads the
 * shared runtime AFTER its own script, so the helper is not here yet — it is
 * registered on the runtime's ready event instead, the same signal the engines
 * already re-render on. */
(function () {
  function mountSend() { if (window.ToolkitSend) ToolkitSend(copyBtn, asText, { after: document.getElementById("preview") }); }
  if (window.ToolkitSend) mountSend(); else document.addEventListener("av:ready", mountSend);
})();
function flash(msg){
  const was = copyBtn.textContent;
  copyBtn.textContent = msg;
  setTimeout(() => { copyBtn.textContent = was; }, 1600);
}
copyBtn.addEventListener("click", async () => {
  const t = asText();
  try {
    await navigator.clipboard.writeText(t);
    flash("Copied");
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.cssText = "position:fixed;left:8px;bottom:70px;width:calc(100% - 16px);height:38vh;z-index:99";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    if (ok) { ta.remove(); flash("Copied"); }
    else { flash("Copy it manually"); ta.addEventListener("blur", () => ta.remove()); }
  }
});

/* Requested date is self-aware — av.js resolves the real date from public sources
   (a job-site tablet's clock can be wrong); the user can still edit it. Need-by
   defaults to ASAP (zero steps); picking a date is one optional click. */
var fReq = document.getElementById("fReq");
var reqTouched = false;
fReq.addEventListener("input", function(){ reqTouched = true; });
function todayStr(){ return (window.AV && AV.todayStr) ? AV.todayStr() : new Date().toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }); }
function setReq(){ if (!reqTouched) fReq.value = todayStr(); }
setReq();
document.addEventListener("av:ready", setReq);
document.addEventListener("av:date", setReq);

var fNeedSel = document.getElementById("fNeedSel");
var fNeedDate = document.getElementById("fNeedDate");
fNeedSel.addEventListener("change", function(){
  var pick = fNeedSel.value === "date";
  fNeedDate.hidden = !pick;
  if (pick) fNeedDate.focus();
});
function needByText(){
  if (fNeedSel.value === "date" && fNeedDate.value){
    var d = new Date(fNeedDate.value + "T00:00:00");
    if (!isNaN(d.getTime())) return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
  }
  return "ASAP";
}

/* ── THE DRAFT ───────────────────────────────────────────────────────────────
 * This page has been live since the kit started and has never kept a single
 * thing anybody typed. A consumables list is a WALK: a lead ticks his way down
 * the van and across two floors over twenty minutes, phone in one hand, and iOS
 * evicts a background tab inside that window without warning. A tool that loses
 * the walk is worse than the paper it replaced, because paper does not pretend.
 *
 * Keyed by ITEM NAME, never by position — write-ins shift every index after
 * them, and a restore keyed on position hands a tech's "x12" to the wrong line,
 * which is a wrong order that reads exactly like a right one.
 *
 * The REQUESTED date is deliberately not saved unless he edited it: it is filled
 * from the resolved date on every load, and a saved copy would print Tuesday's
 * date on Thursday's list — the one field where remembering is the bug. */
draft = Draft.keep({
  key: "toolkit.av.consumables.v1",
  last: true,
  snapshot(){
    const cats = {};
    document.querySelectorAll(".cat").forEach(cat => {
      const id = cat.id.replace(/^cat-/, "");
      const writein = id === "writein";
      const rows = [...cat.querySelectorAll(".item")]
        // A write-in row exists only because somebody typed it, so it is kept
        // whether or not it is ticked. A seed row is only worth keeping once it
        // is on the list.
        .filter(i => writein || i.querySelector(".tick").checked)
        .map(i => ({
          n: i.querySelector(".name").textContent,
          q: i.querySelector(".qty").value,
          note: i.querySelector(".note").value,
          on: i.querySelector(".tick").checked
        }));
      if (rows.length) cats[id] = rows;
    });
    const head = {
      req: reqTouched ? fReq.value : "",
      need: fNeedSel.value,
      date: fNeedDate.value
    };
    const touched = Object.keys(cats).length || head.req || head.need !== "asap" || head.date;
    // NULL IS THE ONLY WAY THE RECORD IS DROPPED. Returning an object here on an
    // untouched page would make Clear un-clearable (§SCARS 2026-08-04).
    return touched ? { cats, head } : null;
  },
  apply(s){
    const h = s.head || {};
    if (h.req) { fReq.value = h.req; reqTouched = true; }
    if (h.need) { fNeedSel.value = h.need; fNeedDate.hidden = h.need !== "date"; }
    if (h.date) fNeedDate.value = h.date;
    Object.keys(s.cats || {}).forEach(id => {
      const cat = document.getElementById("cat-" + id);
      if (!cat) return;
      const ul = cat.querySelector("ul.items");
      const used = [];
      s.cats[id].forEach(row => {
        let li = [...ul.querySelectorAll("li.item")]
          .find(x => x.querySelector(".name").textContent === row.n && used.indexOf(x) === -1);
        // No free row with that name left: it was a write-in, or a seed item that
        // has since been renamed out of the roster. Either way it comes back as a
        // removable row rather than vanishing.
        if (!li){
          ul.insertAdjacentHTML("beforeend", itemHTML(row.n, "", true));
          li = ul.lastElementChild;
        }
        used.push(li);
        if (row.q != null && row.q !== "") li.querySelector(".qty").value = row.q;
        if (row.note) li.querySelector(".note").value = row.note;
        li.querySelector(".tick").checked = !!row.on;
        li.classList.toggle("is-checked", !!row.on);
      });
    });
  }
});

/* The need-by belongs to THIS list, so it rides in the draft and Clear resets it.
   The fields are outside #list, so nothing else was going to notice them. */
["fReq","fNeedSel","fNeedDate"].forEach(id => {
  const e = document.getElementById(id);
  /* refresh(), NOT draft.save() — and the gate is why. These three print on
     line two of the document ("Requested: … · Need by: …") and for this page's
     whole life they saved without re-rendering, because there was nothing on
     the glass to re-render. The block exists now, so a header field that saves
     without repainting is the exact defect order-live-header.mjs is for: the
     copied text is right and the block he proofreads is a generation stale.
     It failed on the first run of the gate that had never been able to see this
     page. refresh() ends in draft.save(), so nothing is lost by going through
     it. */
  e.addEventListener("input", () => refresh());
  e.addEventListener("change", () => refresh());
});

/* ── THE JOBSITE IS STICKY, AND THAT IS WHY IT GETS ITS OWN RECORD ───────────
 * A lead is on one job for a week and sends a list off it most days. Folding the
 * jobsite into the draft made two things wrong at once: Clear could not actually
 * clear (a touched header kept rewriting the record a quarter-second after the
 * wipe — caught by the gate, which is the whole reason the gate reads STORAGE and
 * not the screen), and clearing the list would have cost him the job name he had
 * already typed. Separate record, never touched by Clear — the same split the
 * engine's pages already ship as their sticky header. */
const sticky = Draft.fields(["fJob"]);
const stickyDraft = Draft.keep({
  key: "toolkit.av.consumables.header.v1",
  snapshot: sticky.snapshot,
  apply: sticky.apply
});
/* Two records and one repaint: the sticky one is his jobsite, the list one is
   his order, and the block on the glass is both. Same finding as the three
   above — the jobsite is line ONE of what he sends. */
sticky.watch(() => { stickyDraft.save(); refresh(); });

/* YESTERDAY'S LIST. Clear now removes write-ins outright, so the undo is part of
   the same change rather than a nicety: the only thing that destroys a list is
   the button that also keeps a copy of it. Offered only when one exists. */
const lastWrap = document.getElementById("lastwrap");
function showLast(){ lastWrap.style.display = draft.hasLast() ? "" : "none"; }
document.getElementById("last").addEventListener("click", () => {
  document.querySelectorAll("#cat-writein .item").forEach(i => i.remove());
  document.querySelectorAll(".tick").forEach(t => { t.checked = false; t.closest(".item").classList.remove("is-checked"); });
  draft.restoreLast();
  refresh();
  showLast();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
showLast();

refresh();
</script>
<script src="trade.js"></script>
<script src="tools.js"></script>
<script src="../shared/toolkit.js"></script>
</body>
</html>
