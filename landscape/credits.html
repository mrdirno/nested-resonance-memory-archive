<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wall of Wishes — Field Toolkit</title>
<meta name="description" content="Every tool in this Field Toolkit was wished into existence by someone in the trade. This is the permanent public credit ledger.">
<meta name="theme-color" content="#242A31">
<style>
:root{--steel:#242A31;--ink:#12161A;--zinc:#D7DAD3;--paper:#FBFBF8;--line:#BABEB6;--muted:#5D656E;--flag:#F0BE1E;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow","Roboto Condensed",var(--sans);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}
/* NO overflow-x:hidden here on purpose. It would MASK a horizontal overflow
   instead of fixing it, and hide exactly the defect the pre-ship mobile gate
   exists to catch. Measured 2026-08-04: with it, documentElement.scrollWidth
   read a clean 390 while body.scrollWidth was 489 — the page looked fine and
   was not. Fix the cause in the layout; never paper over it here. */
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--zinc);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}
.plate{background:var(--steel);color:#EEF0EA;margin:0 -16px 20px;padding:18px 16px 16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--flag);display:block;margin-bottom:6px}
.plate h1{font-family:var(--cond);font-weight:700;font-size:clamp(20px,4.6vw,30px);letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:.95}
.lede{margin:8px 0 0;max-width:62ch;color:#B9BFC6;font-size:12.5px}
.count{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
ul.wall{list-style:none;margin:0;padding:0}
.credit{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--flag);border-radius:2px;padding:13px 15px;margin-bottom:11px;overflow-wrap:anywhere}
.credit .who{font-family:var(--cond);text-transform:uppercase;letter-spacing:.03em;font-size:17px;font-weight:700;color:var(--ink)}
.credit .who .co{color:var(--muted);font-weight:400}
.credit .tool{font-size:13px;margin:3px 0 0}
.credit .tool a{color:var(--steel);text-decoration:none;border-bottom:1px solid var(--flag)}
.credit .tool a:hover{color:var(--ink)}
.credit .meta{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.credit .meta a{color:var(--muted);text-decoration:underline}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:2px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;font-size:20px;color:var(--ink);display:block;margin-bottom:6px}
.empty button{margin-top:14px;min-height:44px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:700;background:var(--flag);color:var(--flag-ink,#231B00);border:1px solid var(--flag);border-radius:2px;padding:11px 18px;cursor:pointer}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.foot a{color:var(--steel);text-decoration:none;border-bottom:1px solid var(--flag)}
</style>
</head>
<body>
<div class="wrap">
  <header class="plate">
    <span class="eyebrow">The living ledger</span>
    <h1>Wall of Wishes</h1>
    <p class="lede" id="lede">Every tool in this toolkit was wished into existence by someone in the trade. This is the permanent public credit for them. It can&rsquo;t be erased &mdash; it lives in the project&rsquo;s open git history, forever.</p>
  </header>

  <p class="count" id="count">Loading the ledger&hellip;</p>
  <ul class="wall" id="wall"></ul>

  <footer class="foot">
    <a href="index.html" id="backLink">&larr; Field Toolkit</a>
    <a id="gitLink" href="https://github.com/mrdirno/nested-resonance-memory-archive" target="_blank" rel="noopener">The ledger, in git &rarr;</a>
  </footer>
</div>

<script src="trade.js"></script>
<script src="tools.js"></script>
<script src="../shared/toolkit.js"></script>
<script>
/* WALL OF WISHES — TRADE-GENERIC (backported from av/ 2026-08-04).
 *
 * This file is byte-identical in every trade; the ONLY per-trade input is
 * window.TOOLKIT_TRADE (trade.js) and the sibling credits.json. That is the
 * §TRADE EXPANSION rule applied to a page instead of the runtime: standing up
 * electrical means copying this file unchanged, not editing a fork of it.
 *
 * Why it exists here at all: shared/toolkit.js puts a "Wall of Wishes ->
 * credits.html" link in the nav of EVERY page of EVERY trade, so a trade
 * without this page shipped a 404 to every one of its users. Measured live
 * 2026-08-04: /roofing/credits.html -> 404 while /av/credits.html -> 200.
 */
(function(){
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});};
  var T = window.TOOLKIT_TRADE || {};
  var tradeName = T.name || "Field Toolkit";
  var slug = T.slug || "av";
  var wall = document.getElementById("wall"), count = document.getElementById("count");

  /* Identity, from the trade config — never hardcoded, or this page forks. */
  document.title = "Wall of Wishes — " + tradeName;
  document.getElementById("lede").innerHTML =
    "Every tool in the " + esc(tradeName) + " was wished into existence by someone in the trade. "
    + "This is the permanent public credit for them. It can’t be erased — it lives in the "
    + "project’s open git history, forever.";
  document.getElementById("backLink").innerHTML = "← " + esc(tradeName);
  document.getElementById("gitLink").href =
    "https://github.com/mrdirno/nested-resonance-memory-archive/blob/main/" + encodeURIComponent(slug) + "/credits.json";
  if (T.accent) {
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute("content", T.accent);
  }

  /* An anonymous wisher is credited in THIS trade's words. An acronym stays
   * upper-case ("an anonymous AV tech"); a word lower-cases ("an anonymous
   * roofing tech"). Never invent a name; never publish the email. */
  function anonNoun(){
    var n = T.anonNoun || T.brandLead || "";
    return (/^[A-Z0-9]+$/.test(n)) ? n : n.toLowerCase();
  }

  /* SCAR (av/AV_SOCIETY.md): A BARE ISO DATE IS A CALENDAR DAY, NOT AN INSTANT.
   * new Date("2026-08-04") parses as UTC midnight, so every credit rendered a
   * day EARLY for anyone west of UTC — on a permanent public record. Split it
   * and build a LOCAL date. Carried here deliberately: backporting a capability
   * without its scar fix just re-ships the bug in a new place. */
  function fmt(d){
    if(!d) return "";
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d).trim());
    var x = m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(d);
    return isNaN(x.getTime())? esc(d) : x.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  }

  function render(list){
    if(!list.length){
      count.textContent = "";
      wall.innerHTML = '<li class="empty"><b>No wishes granted yet</b>Be the first — wish for the tool you keep making by hand. If it passes the bar it gets built, and your name lands here, permanently.'
        + '<div><button type="button" id="wellBtn">&#10022; Wish for a tool</button></div></li>';
      var b = document.getElementById("wellBtn");
      if (b) b.addEventListener("click", function(){ if (window.Toolkit && window.Toolkit.openWell) window.Toolkit.openWell(); });
      return;
    }
    count.textContent = list.length + (list.length===1?" wish granted":" wishes granted");
    wall.innerHTML = list.map(function(c){
      var anon = !c.wisher || /^an anonymous/i.test(c.wisher);
      var who = anon ? ("An anonymous " + esc(anonNoun()) + " " + esc(c.role||"pro")).replace(/\s+/g," ") : esc(c.wisher);
      var co = (!anon && c.company) ? ' <span class="co">— '+esc(c.company)+'</span>' : "";
      var toolLink = c.tool_href ? '<a href="'+esc(c.tool_href)+'">'+esc(c.tool_name||"the tool")+'</a>' : esc(c.tool_name||"the tool");
      var commit = c.shipped_commit ? '<a href="https://github.com/mrdirno/nested-resonance-memory-archive/commit/'+esc(c.shipped_commit)+'" target="_blank" rel="noopener">commit '+esc(String(c.shipped_commit).slice(0,7))+'</a>' : "";
      return '<li class="credit"><div class="who">'+who+co+'</div>'
        + '<div class="tool">wished into existence: '+toolLink+'</div>'
        + '<div class="meta">'+(c.shipped_date?'<span>built '+fmt(c.shipped_date)+'</span>':'')
        + (c.wished_date?'<span>wished '+fmt(c.wished_date)+'</span>':'')+(commit?'<span>'+commit+'</span>':'')+'</div></li>';
    }).join("");
  }

  fetch("credits.json", {cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    render(Array.isArray(d.credits)? d.credits.slice().reverse() : []);
  }).catch(function(){ count.textContent=""; render([]); });
})();
</script>
</body>
</html>
