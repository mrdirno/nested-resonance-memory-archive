<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELIOS Interface</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-mono">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [status, setStatus] = useState("Disconnected");
            const [file, setFile] = useState(null);
            const [material, setMaterial] = useState("AIR_STP");
            const [log, setLog] = useState([]);

            useEffect(() => {
                fetch('http://localhost:5001/status')
                    .then(res => res.json())
                    .then(data => setStatus(data.connected ? "Connected" : "Offline (Virtual)"))
                    .catch(() => setStatus("API Unreachable"));
            }, []);

            const addLog = (msg) => setLog(prev => [...prev, `> ${msg}`]);

            const handleUpload = async () => {
                if (!file) {
                    addLog("Error: No file selected.");
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);
                formData.append('material', material);
                formData.append('duration', 5);

                addLog(`Uploading ${file.name}...`);

                try {
                    const res = await fetch('http://localhost:5001/fabricate', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.status === "success") {
                        addLog("SUCCESS: Compilation Complete.");
                        addLog(data.message);
                    } else {
                        addLog(`ERROR: ${data.message}`);
                    }
                } catch (e) {
                    addLog(`NETWORK ERROR: ${e}`);
                }
            };

            return (
                <div className="container mx-auto p-8 max-w-4xl">
                    <header className="mb-8 border-b border-gray-700 pb-4">
                        <h1 className="text-4xl font-bold text-blue-400">HELIOS-BRIDGE</h1>
                        <div className="flex justify-between mt-2">
                            <span className="text-gray-400">Cycle 2353 Prototype</span>
                            <span className={`font-bold ${status.includes("API") ? "text-red-500" : "text-green-500"}`}>
                                System: {status}
                            </span>
                        </div>
                    </header>

                    <div className="grid grid-cols-2 gap-8">
                        <div className="bg-gray-800 p-6 rounded-lg shadow-lg">
                            <h2 className="text-xl font-bold mb-4 text-blue-300">Input Geometry</h2>
                            
                            <div className="mb-4">
                                <label className="block text-sm text-gray-400 mb-2">Target Mesh (.obj)</label>
                                <input 
                                    type="file" 
                                    onChange={e => setFile(e.target.files[0])}
                                    className="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500"
                                />
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm text-gray-400 mb-2">Substrate Material</label>
                                <select 
                                    value={material}
                                    onChange={e => setMaterial(e.target.value)}
                                    className="w-full p-2 bg-gray-700 rounded border border-gray-600"
                                >
                                    <option value="AIR_STP">Air (Standard Temp/Pressure)</option>
                                    <option value="WATER">Water (20C)</option>
                                    <option value="GLYCERIN">Glycerin</option>
                                </select>
                            </div>

                            <button 
                                onClick={handleUpload}
                                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition duration-200"
                            >
                                INITIATE FABRICATION
                            </button>
                        </div>

                        <div className="bg-black p-6 rounded-lg border border-gray-700 font-mono text-sm h-96 overflow-y-auto">
                            <h2 className="text-xl font-bold mb-4 text-green-400">System Log</h2>
                            {log.map((l, i) => (
                                <div key={i} className="mb-1 text-green-300">{l}</div>
                            ))}
                            {log.length === 0 && <span className="text-gray-600">System ready...</span>}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
